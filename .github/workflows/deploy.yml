name: Deploy Frontend

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-frontend-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (staging)
        run: pnpm ng build --configuration staging

      - name: Zip dist folder
        run: zip -r dist.zip dist

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 103.217.144.101 >> ~/.ssh/known_hosts

      - name: Upload dist.zip
        run: |
          scp -i ~/.ssh/id_ed25519 dist.zip sesasi@103.217.144.101:/sesasi/app/sijupri-fe/

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/id_ed25519 sesasi@103.217.144.101 << 'EOF'
            set -e
            cd /sesasi/app/sijupri-fe/

            BACKUP_COUNT=$(ls -1d dist-backup-* 2>/dev/null | wc -l)
            if [ "$BACKUP_COUNT" -gt 3 ]; then
              echo "Cleaning up old backups. Current count: $BACKUP_COUNT"
              ls -1d dist-backup-* | sort | head -n -2 | xargs rm -rf
            fi

            # Backup existing dist
            if [ -d "dist" ]; then
              mv dist dist-backup-$(date +%Y%m%d%H%M%S)
            fi

            # Extract directly (zip already contains dist/)
            unzip -o dist.zip
            rm dist.zip
          EOF
