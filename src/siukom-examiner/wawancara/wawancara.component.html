<button (click)="backToDashboard()" class="btn-back">
    <span class="icon">←</span>
    Kembali ke Dashboard
</button>
<ng-container *ngIf="loadingQuestions(); else questionForm">
    <div class="py-5 text-center">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Memuat...</span>
        </div>
        <p class="mt-2">Memuat form penilaian...</p>
    </div>
</ng-container>
<ng-template #questionForm>
    <div class="assessment-container">
        <div class="header-section">
            <h1>Form Penilaian Wawancara</h1>
            <p>Silakan isi penilaian untuk setiap pertanyaan di bawah ini.</p>
        </div>

        <div class="question-list">
            <div
                *ngFor="let question of questions; let i = index"
                class="question-card"
            >
                <!-- Question Header -->
                <div class="card-header">
                    <span class="question-number"
                        >{{ question.kompetensiIndikatorName }}</span
                    >
                    <h2 class="question-text">{{ question.question }}</h2>
                </div>

                <!-- Candidate Answer Section -->
                <div class="form-group row-spacing">
                    <label [for]="'answer-' + i">Jawaban Peserta:</label>
                    <textarea
                        [(ngModel)]="answers()[question.id].answerText"
                        [id]="'answer-' + i"
                        class="form-control large-textarea"
                        placeholder="Tuliskan jawaban peserta disini..."
                        rows="5"
                    >
                    </textarea>
                </div>

                <!-- Answer Key Link -->
                <div class="row-spacing">
                    <div class="key-label">Kunci Jawaban:</div>
                    <a
                        [href]="question.attachmentUrl"
                        class="action-link"
                        target="_blank"
                    >
                        [ Lihat Kunci Jawaban ]
                        <span class="external-icon">🔗</span>
                    </a>
                </div>

                <!-- Assessment Options -->
                <div class="assessment-section row-spacing">
                    <div class="assessment-label">Penilaian:</div>

                    <div class="radio-group">
                        <!-- Competent Option -->
                        <label
                            [class.selected]="answers()[question.id].answerChoice === 'competent'"
                            class="radio-card competent-option"
                        >
                            <input
                                (ngModelChange)="scheduleAutoSave()"
                                [(ngModel)]="answers()[question.id].answerChoice"
                                [name]="'assessment-' + i"
                                type="radio"
                                value="competent"
                            />
                            <span class="radio-text">Kompeten</span>
                        </label>

                        <!-- Not Competent Option -->
                        <label
                            [class.selected]="answers()[question.id].answerChoice === 'not_competent'"
                            class="radio-card incompetent-option"
                        >
                            <input
                                (ngModelChange)="scheduleAutoSave()"
                                [(ngModel)]="answers()[question.id].answerChoice"
                                [name]="'assessment-' + i"
                                type="radio"
                                value="not_competent"
                            />
                            <span class="radio-text">Tidak Kompeten</span>
                        </label>
                    </div>
                </div>

                <div class="divider"></div>
            </div>
        </div>

        <!-- Submit Button (Sticky Bottom or Bottom Block) -->
        <div class="form-actions">
            <ng-container *ngIf="submitQuestionLoading(); else noLoading">
                <button [disabled]="true" class="btn-submit">
                    <div class="spinner-border spinner-sm-custom" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </button>
            </ng-container>

            <ng-template #noLoading>
                <button
                    (click)="submitAssessment()"
                    [disabled]="!isFormValid()"
                    class="btn-submit"
                    type="button"
                >
                    Simpan Penilaian
                </button>
            </ng-template>
        </div>
    </div>
</ng-template>
