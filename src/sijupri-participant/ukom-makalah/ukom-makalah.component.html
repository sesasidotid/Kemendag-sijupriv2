<ng-container *ngIf="isLoading$ | async; else content">
    <div class="col-12 text-center">
        <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
</ng-container>

<ng-template #content>
    <ng-container *ngIf="isFinished; else notFinished">
        <div class="container">
            <section class="section h-100 d-flex flex-column align-items-center justify-content-center">
                <h3 class="">Waktu Pengerjaan Makalah</h3>

                <button class="btn btn-primary btn-lg mt-3 return-button" (click)="backToHome()">
                    Kembali
                </button>
            </section>
        </div>
    </ng-container>
    <ng-template #notFinished>
        <button class="btn btn-sm btn-outline-secondary mb-3" (click)="afterSubmit.emit()">
            <i class="mdi mdi-chevron-left"></i> Kembali
        </button>
        <form>
            <div class="col-lg-12 mb-3">
                <div class="alert alert-primary" role="alert">
                    {{ question.question }}
                </div>
            </div>

            <div class="col-lg-12">
                <div class="row">
                    <div class="col-12">
                        <app-file-handler [inputs]="inputs"></app-file-handler>
                    </div>
                </div>
            </div>
            <div class="row text-center">
                <div class="col-12">
                    <ng-container *ngIf="isSubmitLoading$ | async; else noLoading">
                        <button class="btn btn-success float-end" disabled>
                            <div class="spinner-border spinner-sm-custom" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </button>
                    </ng-container>
                    <ng-template #noLoading>
                        <button type="button" class="btn btn-success float-end" (click)="onSubmit()" [disabled]="
                                makalah_form.invalid ||
                                (isSubmitLoading$ | async)
                            ">
                            Simpan
                        </button>
                    </ng-template>
                </div>
            </div>
        </form>
    </ng-template>
</ng-template>
