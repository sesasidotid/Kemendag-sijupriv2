<ng-container *ngIf="questionLoading(); else content">
    <div class="col-12 text-center">
        <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
</ng-container>

<ng-template #content>
    <button
        (click)="backToDashboard()"
        class="btn btn-sm btn-outline-secondary mb-3"
    >
        <i class="mdi mdi-chevron-left"></i> Kembali
    </button>
    <form>
        <div class="col-lg-12 mb-3">
            <div class="alert alert-primary" role="alert">
                {{ question.question }}
            </div>
        </div>

        <div class="col-lg-12">
            <div class="row">
                <div class="col-12">
                    <app-file-handler [inputs]="inputs"></app-file-handler>
                </div>
            </div>
        </div>
        <div class="row text-center">
            <div class="col-12">
                <ng-container *ngIf="isSubmitLoading$ | async; else noLoading">
                    <button class="btn btn-primary float-end" disabled>
                        <div
                            class="spinner-border spinner-sm-custom"
                            role="status"
                        >
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </button>
                </ng-container>
                <ng-template #noLoading>
                    <button
                        (click)="onSubmit()"
                        [disabled]="
                                makalah_form.invalid ||
                                (isSubmitLoading$ | async)
                            "
                        class="btn btn-primary float-end"
                        type="button"
                    >
                        Simpan
                    </button>
                </ng-template>
            </div>
        </div>
    </form>
</ng-template>
