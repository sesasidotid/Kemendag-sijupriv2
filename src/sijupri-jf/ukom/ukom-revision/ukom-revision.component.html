<div class="row">
    <div class="col-lg-12">
        <div class="row">
            <app-file-handler [inputs]="inputs"></app-file-handler>
        </div>
    </div>

    <div class="col-lg-12">
        <div class="hstack gap-2 justify-content-end">
            <app-loading-button [isLoading]="ukomParticipantService.isSubmitTaskLoading$ | async" (click)="onSave()"
                [disabled]="isAnyFileMissing()" [type]="'button'">Simpan</app-loading-button>
        </div>
    </div>
</div>
