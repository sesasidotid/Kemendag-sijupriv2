<form [formGroup]="rwKompetensiForm" (ngSubmit)="submit()">
  <div class="row">
    <div class="col-lg-6">
      <div class="mb-3">
        <label for="name" class="form-label">
          Nama Kompetensi <span class="text-danger">*</span>
        </label>
        <input
          type="text"
          class="form-control"
          name="name"
          id="name"
          formControlName="name"
          placeholder="Masukan nama Kompetensi"
        />
        <div
          *ngIf="getErrorMessage('name', 'Nama kompetensi') as error"
          class="text-danger"
        >
          {{ error }}
        </div>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="mb-3">
        <label for="kategoriPengembanganId" class="form-label">
          Kategori Pengembangan <span class="text-danger">*</span>
        </label>
        <select
          disabled
          *ngIf="
            !kategoriPengembanganList || (kategoriPengembanganLoading$ | async)
          "
          class="form-select"
        >
          <option selected value="" style="display: none">
            Kategori Pengembangan tidak tersedia
          </option>
        </select>
        <select
          *ngIf="
            kategoriPengembanganList && !(kategoriPengembanganLoading$ | async)
          "
          class="form-select"
          id="kategoriPengembanganId"
          formControlName="kategoriPengembanganId"
          name="kategoriPengembanganId"
        >
          <option selected value="" style="display: none">
            Pilih Kategori Pengembangan
          </option>
          <option
            *ngFor="let kategoriPengembangan of kategoriPengembanganList"
            [value]="kategoriPengembangan.id"
          >
            {{ kategoriPengembangan.name }}
          </option>
        </select>
        <div
          *ngIf="
            getErrorMessage(
              'kategoriPengembanganId',
              'Kategori pengembangan'
            ) as error
          "
          class="text-danger"
        >
          {{ error }}
        </div>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="mb-3">
        <label for="dateStart" class="form-label">
          Tanggal Mulai <span class="text-danger">*</span>
        </label>
        <input
          type="date"
          class="form-control"
          name="dateStart"
          id="dateStart"
          formControlName="dateStart"
        />
        <div
          *ngIf="getErrorMessage('dateStart', 'Tanggal mulai') as error"
          class="text-danger"
        >
          {{ error }}
        </div>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="mb-3">
        <label for="dateEnd" class="form-label">
          Tanggal Berakhir <span class="text-danger">*</span>
        </label>
        <input
          type="date"
          class="form-control"
          name="dateEnd"
          id="dateEnd"
          formControlName="dateEnd"
        />
        <div
          *ngIf="getErrorMessage('dateEnd', 'Tanggal berakhir') as error"
          class="text-danger"
        >
          {{ error }}
        </div>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="mb-3">
        <label for="lastnameInput" class="form-label">
          Tanggal Sertifikat <span class="text-danger">*</span>
        </label>
        <input
          type="date"
          class="form-control"
          name="tglSertifikat"
          id="tglSertifikat"
          formControlName="tglSertifikat"
        />
        <div
          *ngIf="
            getErrorMessage('tglSertifikat', 'Tanggal sertifikat') as error
          "
          class="text-danger"
        >
          {{ error }}
        </div>
      </div>
    </div>
    <div class="col-lg-12">
      <div class="row">
        <app-file-handler [inputs]="inputs"></app-file-handler>
      </div>
    </div>
    <div class="col-lg-12">
      <div class="hstack gap-2 justify-content-end">
        <ng-container *ngIf="submitLoading$ | async; else noLoading">
          <button class="btn btn-primary" disabled>
            <div
              class="spinner-border"
              style="width: 19px; height: 19px"
              role="status"
            >
              <span class="visually-hidden">Loading...</span>
            </div>
          </button>
        </ng-container>
        <ng-template #noLoading>
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="rwKompetensiForm.invalid || (submitLoading$ | async)"
          >
            Simpan
          </button>
        </ng-template>
      </div>
    </div>
  </div>
</form>
