<div
  *ngIf="loading$ | async; else hadItem"
  class="d-flex justify-content-center"
>
  <div class="spinner-border" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>

<ng-template #hadItem>
  <div *ngIf="!isEditOpen">
    <div class="">
      <div class="row">
        <!-- First Name -->
        <div class="col-md-6 mb-3">
          <label for="firstnameInput" class="form-label">
            <i class="mdi mdi-account-circle text-muted me-2"></i>Nama Lengkap
          </label>
          <p class="border-bottom pb-2">{{ jf.name }}</p>
        </div>

        <!-- No. HP -->
        <div *ngIf="jf.phone" class="col-md-6 mb-3">
          <label for="phoneInput" class="form-label">
            <i class="mdi mdi-phone text-muted me-2"></i> No. HP
          </label>
          <p class="border-bottom pb-2">{{ jf.phone }}</p>
        </div>
        <!-- Email -->
        <div *ngIf="jf.email" class="col-md-6 mb-3">
          <label for="emailInput" class="form-label">
            <i class="mdi mdi-email text-muted me-2"></i> Email
          </label>
          <p class="border-bottom pb-2">{{ jf.email }}</p>
        </div>

        <!-- Tempat Lahir -->
        <div *ngIf="jf.tempatLahir" class="col-md-6 mb-3">
          <label for="birthplaceInput" class="form-label">
            <i class="mdi mdi-map-marker text-muted me-2"></i> Tempat Lahir
          </label>
          <p class="border-bottom pb-2">{{ jf.tempatLahir }}</p>
        </div>

        <!-- Tanggal Lahir -->
        <div *ngIf="jf.tanggalLahir" class="col-md-6 mb-3">
          <label for="birthdateInput" class="form-label">
            <i class="mdi mdi-calendar-range text-muted me-2"></i> Tanggal Lahir
          </label>
          <p class="border-bottom pb-2">{{ jf.tanggalLahir }}</p>
        </div>

        <!-- Jenis Kelamin -->
        <div *ngIf="jf.jenisKelaminName" class="col-md-6 mb-3">
          <label for="genderInput" class="form-label">
            <i class="mdi mdi-gender-male-female text-muted me-2"></i> Jenis
            Kelamin
          </label>
          <p class="border-bottom pb-2">{{ jf.jenisKelaminName }}</p>
        </div>

        <!-- NIK -->
        <div *ngIf="jf.nik" class="col-md-6 mb-3">
          <label for="nikInput" class="form-label">
            <i class="mdi mdi-card-account-details text-muted me-2"></i> NIK
          </label>
          <p class="border-bottom pb-2">{{ jf.nik }}</p>
        </div>

        <!-- File Upload -->
        <div *ngIf="jf.ktpUrl" class="col-md-6 mb-3">
          <app-file-handler [inputs]="inputs"></app-file-handler>
        </div>
      </div>

      <!-- Edit Button -->
      <div class="row">
        <div class="col-12 d-flex justify-content-end mt-3">
          <a (click)="toggleEdit()" class="btn btn-primary">Ajukan Perubahan</a>
        </div>
      </div>
    </div>
  </div>
</ng-template>
<form *ngIf="isEditOpen" [formGroup]="jfDetailForm" (ngSubmit)="submit()">
  <div class="row">
    <div class="col-lg-12">
      <div class="mb-3">
        <label for="name" class="form-label">
          Nama Lengkap <span class="text-danger">*</span>
        </label>
        <input
          type="text"
          class="form-control"
          id="name"
          placeholder="Masukkan nama lengkap"
          name="name"
          formControlName="name"
        />
        <div
          *ngIf="getErrorMessage('name', 'Nama lengkap') as error"
          class="text-danger"
        >
          {{ error }}
        </div>
      </div>
      <!--end col-->
      <div class="col-lg-12">
        <div class="mb-3">
          <label for="phone" class="form-label">
            No. HP <span class="text-danger">*</span>
          </label>
          <input
            type="text"
            class="form-control"
            id="phone"
            placeholder="Masukkan No. HP"
            name="phone"
            formControlName="phone"
          />
          <div
            *ngIf="getErrorMessage('phone', 'No. HP') as error"
            class="text-danger"
          >
            {{ error }}
          </div>
        </div>
      </div>
      <div class="col-lg-12">
        <div class="mb-3">
          <label for="email" class="form-label">
            Email <span class="text-danger">*</span>
          </label>
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="Masukkan email"
            name="email"
            formControlName="email"
          />
          <div
            *ngIf="getErrorMessage('email', 'Email') as error"
            class="text-danger"
          >
            {{ error }}
          </div>
        </div>
      </div>
      <!--end col-->
      <div class="col-lg-12">
        <div class="mb-3">
          <label for="tempatLahir" class="form-label">
            Tempat Lahir <span class="text-danger">*</span>
          </label>
          <input
            type="text"
            class="form-control"
            id="tempatLahir"
            placeholder="Masukkan Tempat Lahir"
            name="tempatLahir"
            formControlName="tempatLahir"
          />
          <div
            *ngIf="getErrorMessage('tempatLahir', 'Tempat Lahir') as error"
            class="text-danger"
          >
            {{ error }}
          </div>
        </div>
      </div>
      <div class="col-lg-12">
        <div class="mb-3">
          <label for="tanggalLahir" class="form-label">
            Tanggal Lahir <span class="text-danger">*</span>
          </label>
          <input
            type="date"
            class="form-control"
            id="tanggalLahir"
            placeholder="Masukkan Tanggal Lahir"
            name="tanggalLahir"
            formControlName="tanggalLahir"
          />
          <div
            *ngIf="getErrorMessage('tanggalLahir', 'Tanggal Lahir') as error"
            class="text-danger"
          >
            {{ error }}
          </div>
        </div>
      </div>
      <div class="col-lg-12">
        <div class="mb-3">
          <label for="jenisKelaminCode" class="form-label">
            Jenis Kelamin <span class="text-danger">*</span>
          </label>
          <select
            class="form-select"
            name="jenisKelaminCode"
            formControlName="jenisKelaminCode"
          >
            <option selected value="" style="display: none">
              Pilih Jenis Kelamin
            </option>
            <option
              *ngFor="let jenisKelamin of jenisKelaminList"
              [value]="jenisKelamin.code"
            >
              {{ jenisKelamin.name }}
            </option>
          </select>
          <div
            *ngIf="
              getErrorMessage('jenisKelaminCode', 'Jenis Kelamin') as error
            "
            class="text-danger"
          >
            {{ error }}
          </div>
        </div>
      </div>
      <div class="row">
        <div class="">
          <div class="mb-3">
            <label for="nik" class="form-label">
              NIK <span class="text-danger">*</span>
            </label>
            <input
              type="text"
              class="form-control"
              id="nik"
              placeholder="Masukkan NIK"
              name="nik"
              formControlName="nik"
            />
            <div
              *ngIf="getErrorMessage('nik', 'NIK') as error"
              class="text-danger"
            >
              {{ error }}
            </div>
          </div>
        </div>
        <div class="col-lg-12">
          <div class="mb-3">
            <app-file-handler [inputs]="inputs"></app-file-handler>
            <div
              *ngIf="getErrorMessage('fileKtp', 'Dokumen KTP') as error"
              class="text-danger"
            >
              {{ error }}
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-lg-12">
      <div class="hstack gap-2 justify-content-end">
        <a (click)="toggleEdit()" class="btn btn-soft-secondary me-1"
          >Kembali</a
        >
        <ng-container *ngIf="submitLoading$ | async; else noLoading">
          <button class="btn btn-primary" disabled>
            <div
              class="spinner-border"
              style="width: 19px; height: 19px"
              role="status"
            >
              <span class="visually-hidden">Loading...</span>
            </div>
          </button>
        </ng-container>
        <ng-template #noLoading>
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="jfDetailForm.invalid || (submitLoading$ | async)"
          >
            Simpan
          </button>
        </ng-template>
      </div>
    </div>
  </div>
</form>
