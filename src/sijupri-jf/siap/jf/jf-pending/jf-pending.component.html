<div
  *ngIf="loading$ | async; else hadItem"
  class="d-flex justify-content-center"
>
  <div class="spinner-border" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>

<ng-template #hadItem>
  <form
    *ngIf="pendingTask; else emptyBlock"
    [formGroup]="jfDetailForm"
    (ngSubmit)="submit()"
  >
    <div *ngIf="pendingTask.remark" class="alert alert-warning" role="alert">
      <strong>Catatan Revisi : </strong>"{{ pendingTask.remark }}"
    </div>
    <div
      *ngIf="pendingTask.flowId === 'siap_flow_1'"
      class="alert alert-info"
      role="alert"
    >
      <strong>Status : </strong>Menunggu review dari admin unit kerja.
    </div>
    <div class="row">
      <div class="col-lg-12">
        <div class="mb-3">
          <label for="name" class="form-label">
            Nama Lengkap <span class="text-danger">*</span>
          </label>
          <input
            type="text"
            class="form-control"
            id="name"
            placeholder="Masukkan nama lengkap"
            name="name"
            formControlName="name"
          />
          <div
            *ngIf="getErrorMessage('name', 'Nama lengkap') as error"
            class="text-danger"
          >
            {{ error }}
          </div>
        </div>
        <!--end col-->
        <div class="col-lg-12">
          <div class="mb-3">
            <label for="phone" class="form-label">
              No. HP <span class="text-danger">*</span>
            </label>
            <input
              type="text"
              class="form-control"
              id="phone"
              placeholder="Masukkan No. HP"
              name="phone"
              formControlName="phone"
            />
            <div
              *ngIf="getErrorMessage('phone', 'No. HP') as error"
              class="text-danger"
            >
              {{ error }}
            </div>
          </div>
        </div>
        <div class="col-lg-12">
          <div class="mb-3">
            <label for="email" class="form-label">
              Email <span class="text-danger">*</span>
            </label>
            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="Masukkan email"
              name="email"
              formControlName="email"
            />
            <div
              *ngIf="getErrorMessage('email', 'Email') as error"
              class="text-danger"
            >
              {{ error }}
            </div>
          </div>
        </div>
        <!--end col-->
        <div class="col-lg-12">
          <div class="mb-3">
            <label for="tempatLahir" class="form-label">
              Tempat Lahir <span class="text-danger">*</span>
            </label>
            <input
              type="text"
              class="form-control"
              id="tempatLahir"
              placeholder="Masukkan Tempat Lahir"
              name="tempatLahir"
              formControlName="tempatLahir"
            />
            <div
              *ngIf="getErrorMessage('tempatLahir', 'Tempat Lahir') as error"
              class="text-danger"
            >
              {{ error }}
            </div>
          </div>
        </div>
        <div class="col-lg-12">
          <div class="mb-3">
            <label for="tanggalLahir" class="form-label">
              Tanggal Lahir <span class="text-danger">*</span>
            </label>
            <input
              type="date"
              class="form-control"
              id="tanggalLahir"
              placeholder="Masukkan Tanggal Lahir"
              name="tanggalLahir"
              formControlName="tanggalLahir"
            />
            <div
              *ngIf="getErrorMessage('tanggalLahir', 'Tanggal Lahir') as error"
              class="text-danger"
            >
              {{ error }}
            </div>
          </div>
        </div>
        <div class="col-lg-12">
          <div class="mb-3">
            <label for="jenisKelaminCode" class="form-label">
              Jenis Kelamin <span class="text-danger">*</span>
            </label>
            <select
              class="form-select"
              name="jenisKelaminCode"
              formControlName="jenisKelaminCode"
            >
              <option selected value="" style="display: none">
                Pilih Jenis Kelamin
              </option>
              <option
                *ngFor="let jenisKelamin of jenisKelaminList"
                [value]="jenisKelamin.code"
              >
                {{ jenisKelamin.name }}
              </option>
            </select>
            <div
              *ngIf="
                getErrorMessage('jenisKelaminCode', 'Jenis Kelamin') as error
              "
              class="text-danger"
            >
              {{ error }}
            </div>
          </div>
        </div>
        <div class="row">
          <div class="">
            <div class="mb-3">
              <label for="nik" class="form-label">
                NIK <span class="text-danger">*</span>
              </label>
              <input
                type="text"
                class="form-control"
                id="nik"
                placeholder="Masukkan NIK"
                name="nik"
                formControlName="nik"
              />
              <div
                *ngIf="getErrorMessage('nik', 'NIK') as error"
                class="text-danger"
              >
                {{ error }}
              </div>
            </div>
          </div>
          <div class="col-lg-12">
            <div class="mb-3">
              <app-file-handler [inputs]="inputs"></app-file-handler>
              <div
                *ngIf="getErrorMessage('fileKtp', 'Dokumen KTP') as error"
                class="text-danger"
              >
                {{ error }}
              </div>
            </div>
          </div>
        </div>
      </div>
      <div
        *ngIf="pendingTask && pendingTask.flowId != 'siap_flow_1'"
        class="col-lg-12"
      >
        <div class="hstack gap-2 justify-content-end">
          <ng-container *ngIf="submitLoading$ | async; else noLoading">
            <button class="btn btn-primary" disabled>
              <div
                class="spinner-border"
                style="width: 19px; height: 19px"
                role="status"
              >
                <span class="visually-hidden">Loading...</span>
              </div>
            </button>
          </ng-container>
          <ng-template #noLoading>
            <button
              type="submit"
              class="btn btn-primary"
              [disabled]="jfDetailForm.invalid || (submitLoading$ | async)"
            >
              Simpan
            </button>
          </ng-template>
        </div>
      </div>
    </div>
  </form>

  <ng-template #emptyBlock>
    <app-empty-state
      [title]="'Belum ada pengajuan perubahan profil'"
      [description]="
        'Kamu bisa mengajukan perubahan profil dengan menekan tombol dibawah ini.'
      "
      [buttonText]="'Ajukan Perubahan'"
      [buttonAction]="ajukanPerubahan"
      [buttonIcon]="'mdi-pencil'"
    ></app-empty-state>
  </ng-template>
</ng-template>
