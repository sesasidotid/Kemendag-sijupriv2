<app-pagable *ngIf="!isDetailOpen" [pagable]="pagable"></app-pagable>
<form *ngIf="isDetailOpen" (submit)="submit()" [formGroup]="rwKinerjaForm">
  <div *ngIf="pendingTask.remark" class="alert alert-warning" role="alert">
    {{ pendingTask.remark }}
  </div>
  <div class="row">
    <div class="row col-lg-12 top-selector">
      <div class="col-12 col-lg-6 top-selector">
        <div class="mb-3">
          <label for="firstnameInput" class="form-label">
            Tahunan/Bulanan <span class="text-danger">*</span>
          </label>
          <select class="form-select" name="type" formControlName="type">
            <option [value]="undefined">Pilih</option>
            <option [value]="'tahunan'">tahunan</option>
            <option [value]="'bulanan'">bulanan</option>
          </select>
          <div
            *ngIf="getErrorMessage('type', 'Tipe') as error"
            class="text-danger"
          >
            {{ error }}
          </div>
        </div>
      </div>
    </div>

    <div class="col-lg-6">
      <div class="mb-3">
        <label for="lastnameInput" class="form-label">
          Tanggal Mulai Hitung Penilaian <span class="text-danger">*</span>
        </label>
        <input
          type="date"
          class="form-control"
          name="dateStart"
          formControlName="dateStart"
        />
        <div
          *ngIf="getErrorMessage('dateStart', 'Tanggal Mulai') as error"
          class="text-danger"
        >
          {{ error }}
        </div>
      </div>
    </div>

    <div class="col-lg-6">
      <div class="mb-3">
        <label for="lastnameInput" class="form-label">
          Tanggal Selesai Hitung Penilaian <span class="text-danger">*</span>
        </label>
        <input
          type="date"
          class="form-control"
          name="dateEnd"
          formControlName="dateEnd"
        />
        <div
          *ngIf="getErrorMessage('dateEnd', 'Tanggal Selesai') as error"
          class="text-danger"
        >
          {{ error }}
        </div>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="mb-3">
        <label for="ratingHasilId" class="form-label">
          Rating Hasil Kinerja <span class="text-danger">*</span>
        </label>
        <select
          class="form-select"
          name="ratingHasilId"
          id="ratingHasilId"
          formControlName="ratingHasilId"
          [disabled]="!ratingKinerjaList || (ratingLoading$ | async)"
        >
          <option selected value="" style="display: none">
            Pilih Rating Hasil
          </option>
          <option
            *ngFor="let ratingKinerja of ratingKinerjaList"
            [value]="ratingKinerja.id"
          >
            {{ ratingKinerja.name }}
          </option>
        </select>
        <div
          *ngIf="
            getErrorMessage('ratingHasilId', 'Rating Hasil Kinerja') as error
          "
          class="text-danger"
        >
          {{ error }}
        </div>
      </div>
    </div>

    <div class="col-lg-6">
      <div class="mb-3">
        <label for="firstnameInput" class="form-label">
          Rating Perilaku Kinerja <span class="text-danger">*</span>
        </label>
        <select
          [disabled]="!ratingKinerjaList && (ratingLoading$ | async)"
          class="form-select"
          name="ratingKinerjaId"
          id="ratingKinerjaId"
          formControlName="ratingKinerjaId"
        >
          <option selected value="" style="display: none">
            Pilih Rating Kinerja
          </option>
          <option
            *ngFor="let ratingKinerja of ratingKinerjaList"
            [value]="ratingKinerja.id"
          >
            {{ ratingKinerja.name }}
          </option>
        </select>
        <div
          *ngIf="
            getErrorMessage(
              'ratingKinerjaId',
              'Rating Perilaku Kinerja'
            ) as error
          "
          class="text-danger"
        >
          {{ error }}
        </div>
      </div>
    </div>

    <div class="col-lg-6">
      <div class="mb-3">
        <label for="firstnameInput" class="form-label">
          Predikat Kinerja <span class="text-danger">*</span>
        </label>

        <select
          [disabled]="!predikatKinerjaList && (predikatLoading$ | async)"
          class="form-select"
          name="predikatKinerjaId"
          id="predikatKinerjaId"
          formControlName="predikatKinerjaId"
        >
          <option selected value="" style="display: none">
            Pilih Predikat Kinerja
          </option>
          <option
            *ngFor="let predikatKinerja of predikatKinerjaList"
            [value]="predikatKinerja.id"
          >
            {{ predikatKinerja.name }}
          </option>
        </select>
        <div
          *ngIf="
            getErrorMessage('predikatKinerjaId', 'Predikat Kinerja') as error
          "
          class="text-danger"
        >
          {{ error }}
        </div>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="mb-3">
        <label for="lastnameInput" class="form-label"
          >Angka Kredit <span class="text-danger">*</span></label
        >
        <input
          type="number"
          class="form-control"
          name="angkaKredit"
          formControlName="angkaKredit"
        />
        <div
          *ngIf="getErrorMessage('angkaKredit', 'Angka Kredit') as error"
          class="text-danger"
        >
          {{ error }}
        </div>
      </div>
    </div>
    <div class="col-lg-12">
      <div class="row" *ngIf="inputs">
        <app-file-handler [inputs]="inputs"></app-file-handler>
      </div>
    </div>
    <div class="col-lg-12">
      <div class="hstack gap-2 justify-content-end">
        <button
          type="submit"
          class="btn btn-soft-secondary me-2"
          (click)="back()"
        >
          Kembali
        </button>
        <ng-container *ngIf="submitLoading$ | async; else noLoading">
          <button class="btn btn-primary" disabled>
            <div
              class="spinner-border"
              style="width: 19px; height: 19px"
              role="status"
            >
              <span class="visually-hidden">Loading...</span>
            </div>
          </button>
        </ng-container>
        <ng-template #noLoading>
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="rwKinerjaForm.invalid || (submitLoading$ | async)"
          >
            Simpan
          </button>
        </ng-template>
      </div>
    </div>
  </div>
</form>
