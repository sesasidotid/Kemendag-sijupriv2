<app-pagable *ngIf="!isDetailOpen" [pagable]="pagable"></app-pagable>
<form *ngIf="isDetailOpen" (submit)="submit()" [formGroup]="rwKinerjaForm">
    <div *ngIf="pendingTask.remark" class="alert alert-warning" role="alert">
        {{ pendingTask.remark }}
    </div>
    <div class="row">
        <div class="col-lg-6">
            <div class="mb-3">
                <label for="firstnameInput" class="form-label">
                    Tahunan/Bulanan <span class="text-danger">*</span>
                </label>
                <select class="form-select" name="type" formControlName="type">
                    <option selected value="" style="display: none">
                        Pilih Tahunan/Bulanan
                    </option>
                    <option [value]="'tahunan'">Tahunan</option>
                    <option [value]="'bulanan'">Bulanan</option>
                </select>
                <div
                    *ngIf="getErrorMessage('type', 'Tipe') as error"
                    class="text-danger"
                >
                    {{ error }}
                </div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="mb-3">
                <label for="yearPicker" class="form-label">
                    Tahun Penilaian <span class="text-danger">*</span>
                </label>
                <select
                    class="form-select"
                    id="yearPicker"
                    formControlName="year"
                    (change)="
                        isAnnual ? onYearSelected() : onMonthRangeSelected()
                    "
                >
                    <option selected value="" style="display: none">
                        Pilih Tahun
                    </option>
                    <option *ngFor="let year of years" [value]="year">
                        {{ year }}
                    </option>
                </select>
                <div
                    *ngIf="getErrorMessage('year', 'Tahun') as error"
                    class="text-danger"
                >
                    {{ error }}
                </div>
            </div>
        </div>

        <ng-container *ngIf="!isAnnual">
            <div class="col-lg-6">
                <div class="mb-3">
                    <label for="monthStartPicker" class="form-label">
                        Bulan Mulai Penilaian <span class="text-danger">*</span>
                    </label>
                    <select
                        class="form-select"
                        id="monthStartPicker"
                        formControlName="monthStart"
                        (change)="onMonthRangeSelected()"
                    >
                        <option selected value="" style="display: none">
                            Pilih Bulan Mulai
                        </option>
                        <option
                            *ngFor="let month of months"
                            [value]="month.value"
                        >
                            {{ month.name }}
                        </option>
                    </select>
                    <div
                        *ngIf="
                            getErrorMessage(
                                'monthStart',
                                'Bulan Mulai'
                            ) as error
                        "
                        class="text-danger"
                    >
                        {{ error }}
                    </div>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="mb-3">
                    <label for="monthEndPicker" class="form-label">
                        Bulan Selesai Penilaian
                        <span class="text-danger">*</span>
                    </label>
                    <select
                        class="form-select"
                        id="monthEndPicker"
                        formControlName="monthEnd"
                        (change)="onMonthRangeSelected()"
                    >
                        <option selected value="" style="display: none">
                            Pilih Bulan Selesai
                        </option>
                        <option
                            *ngFor="let month of months"
                            [value]="month.value"
                        >
                            {{ month.name }}
                        </option>
                    </select>
                    <div
                        *ngIf="
                            getErrorMessage(
                                'monthEnd',
                                'Bulan Selesai'
                            ) as error
                        "
                        class="text-danger"
                    >
                        {{ error }}
                    </div>
                </div>
            </div>
        </ng-container>

        <input type="hidden" formControlName="dateStart" />
        <input type="hidden" formControlName="dateEnd" />

        <div class="col-lg-6">
            <div class="mb-3">
                <label for="ratingHasilId" class="form-label">
                    Rating Hasil Kinerja <span class="text-danger">*</span>
                </label>
                <select
                    class="form-select"
                    name="ratingHasilId"
                    id="ratingHasilId"
                    formControlName="ratingHasilId"
                    [disabled]="!ratingKinerjaList || (ratingLoading$ | async)"
                >
                    <option selected value="" style="display: none">
                        Pilih Rating Hasil
                    </option>
                    <option
                        *ngFor="let ratingKinerja of ratingKinerjaList"
                        [value]="ratingKinerja.id"
                    >
                        {{ ratingKinerja.name }}
                    </option>
                </select>
                <div
                    *ngIf="
                        getErrorMessage(
                            'ratingHasilId',
                            'Rating Hasil Kinerja'
                        ) as error
                    "
                    class="text-danger"
                >
                    {{ error }}
                </div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="mb-3">
                <label for="firstnameInput" class="form-label">
                    Rating Perilaku Kinerja <span class="text-danger">*</span>
                </label>
                <select
                    [disabled]="!ratingKinerjaList && (ratingLoading$ | async)"
                    class="form-select"
                    name="ratingKinerjaId"
                    id="ratingKinerjaId"
                    formControlName="ratingKinerjaId"
                >
                    <option selected value="" style="display: none">
                        Pilih Rating Kinerja
                    </option>
                    <option
                        *ngFor="let ratingKinerja of ratingKinerjaList"
                        [value]="ratingKinerja.id"
                    >
                        {{ ratingKinerja.name }}
                    </option>
                </select>
                <div
                    *ngIf="
                        getErrorMessage(
                            'ratingKinerjaId',
                            'Rating Perilaku Kinerja'
                        ) as error
                    "
                    class="text-danger"
                >
                    {{ error }}
                </div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="mb-3">
                <label for="firstnameInput" class="form-label">
                    Predikat Kinerja <span class="text-danger">*</span>
                </label>

                <select
                    [disabled]="
                        !predikatKinerjaList && (predikatLoading$ | async)
                    "
                    class="form-select"
                    name="predikatKinerjaId"
                    id="predikatKinerjaId"
                    formControlName="predikatKinerjaId"
                >
                    <option selected value="" style="display: none">
                        Pilih Predikat Kinerja
                    </option>
                    <option
                        *ngFor="let predikatKinerja of predikatKinerjaList"
                        [value]="predikatKinerja.id"
                    >
                        {{ predikatKinerja.name }}
                    </option>
                </select>
                <div
                    *ngIf="
                        getErrorMessage(
                            'predikatKinerjaId',
                            'Predikat Kinerja'
                        ) as error
                    "
                    class="text-danger"
                >
                    {{ error }}
                </div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="mb-3">
                <label for="lastnameInput" class="form-label"
                    >Angka Kredit <span class="text-danger">*</span></label
                >
                <input
                    type="number"
                    class="form-control"
                    name="angkaKredit"
                    formControlName="angkaKredit"
                />
                <div
                    *ngIf="
                        getErrorMessage('angkaKredit', 'Angka Kredit') as error
                    "
                    class="text-danger"
                >
                    {{ error }}
                </div>
            </div>
        </div>
        <div class="col-lg-12">
            <div class="row" *ngIf="inputs">
                <app-file-handler [inputs]="inputs"></app-file-handler>
            </div>
        </div>
        <div class="col-lg-12">
            <div class="hstack gap-2 justify-content-end">
                <button
                    type="submit"
                    class="btn btn-soft-secondary me-2"
                    (click)="back()"
                >
                    Kembali
                </button>
                <ng-container *ngIf="submitLoading$ | async; else noLoading">
                    <button class="btn btn-primary" disabled>
                        <div
                            class="spinner-border"
                            style="width: 19px; height: 19px"
                            role="status"
                        >
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </button>
                </ng-container>
                <ng-template #noLoading>
                    <button
                        type="submit"
                        class="btn btn-primary"
                        [disabled]="
                            rwKinerjaForm.invalid || (submitLoading$ | async)
                        "
                    >
                        Simpan
                    </button>
                </ng-template>
            </div>
        </div>
    </div>
</form>
