<form [formGroup]="rwKinerjaForm" (ngSubmit)="submit()">
  <div class="row">
    <div class="row col-lg-12">
      <div class="col-lg-6 top-selector">
        <div class="mb-3">
          <label for="type" class="form-label">
            Tahunan/Bulanan <span class="text-danger">*</span>
          </label>
          <select
            class="form-select"
            name="type"
            id="type"
            formControlName="type"
          >
            <option selected value="" style="display: none">
              Pilih Tahunan/Bulanan
            </option>
            <option [value]="'tahunan'">Tahunan</option>
            <option [value]="'bulanan'">Bulanan</option>
          </select>
          <div
            *ngIf="getErrorMessage('type', 'Tipe') as error"
            class="text-danger"
          >
            {{ error }}
          </div>
        </div>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="mb-3">
        <label for="dateStart" class="form-label">
          Tanggal Mulai Hitung Penilaian <span class="text-danger">*</span>
        </label>
        <input
          type="date"
          class="form-control"
          name="dateStart"
          id="dateStart"
          formControlName="dateStart"
        />
        <div
          *ngIf="getErrorMessage('dateStart', 'Tanggal mulai') as error"
          class="text-danger"
        >
          {{ error }}
        </div>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="mb-3">
        <label for="dateEnd" class="form-label">
          Tanggal Selesai Hitung Penilaian <span class="text-danger">*</span>
        </label>
        <input
          type="date"
          class="form-control"
          name="dateEnd"
          id="dateEnd"
          formControlName="dateEnd"
        />
        <div
          *ngIf="getErrorMessage('dateEnd', 'Tanggal selesai') as error"
          class="text-danger"
        >
          {{ error }}
        </div>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="mb-3">
        <label for="ratingHasilId" class="form-label">
          Rating Hasil Kinerja <span class="text-danger">*</span>
        </label>
        <select
          disabled
          *ngIf="!ratingKinerjaList || (ratingLoading$ | async)"
          class="form-select"
        >
          <option selected value="" style="display: none">
            Pilih Rating Hasil
          </option>
        </select>
        <select
          *ngIf="ratingKinerjaList && !(ratingLoading$ | async)"
          class="form-select"
          name="ratingHasilId"
          id="ratingHasilId"
          formControlName="ratingHasilId"
        >
          <option selected value="" style="display: none">
            Pilih Rating Hasil
          </option>
          <option
            *ngFor="let ratingKinerja of ratingKinerjaList"
            [value]="ratingKinerja.id"
          >
            {{ ratingKinerja.name }}
          </option>
        </select>
        <div
          *ngIf="getErrorMessage('ratingHasilId', 'Rating hasil') as error"
          class="text-danger"
        >
          {{ error }}
        </div>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="mb-3">
        <label for="ratingKinerjaId" class="form-label">
          Rating Perilaku Kinerja <span class="text-danger">*</span>
        </label>
        <select
          disabled
          *ngIf="!ratingKinerjaList || (ratingLoading$ | async)"
          class="form-select"
        >
          <option selected value="" style="display: none">
            Pilih Rating Kinerja
          </option>
        </select>
        <select
          *ngIf="ratingKinerjaList && !(ratingLoading$ | async)"
          class="form-select"
          name="ratingKinerjaId"
          id="ratingKinerjaId"
          formControlName="ratingKinerjaId"
        >
          <option selected value="" style="display: none">
            Pilih Rating Kinerja
          </option>
          <option
            *ngFor="let ratingKinerja of ratingKinerjaList"
            [value]="ratingKinerja.id"
          >
            {{ ratingKinerja.name }}
          </option>
        </select>
        <div
          *ngIf="getErrorMessage('ratingKinerjaId', 'Rating perilaku') as error"
          class="text-danger"
        >
          {{ error }}
        </div>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="mb-3">
        <label for="predikatKinerjaId" class="form-label">
          Predikat Kinerja <span class="text-danger">*</span>
        </label>
        <select
          disabled
          *ngIf="!predikatKinerjaList || (predikatLoading$ | async)"
          class="form-select"
        >
          <option selected value="" style="display: none">
            Pilih Predikat Kinerja
          </option>
        </select>
        <select
          *ngIf="predikatKinerjaList && !(predikatLoading$ | async)"
          class="form-select"
          name="predikatKinerjaId"
          id="predikatKinerjaId"
          formControlName="predikatKinerjaId"
        >
          <option selected value="" style="display: none">
            Pilih Predikat Kinerja
          </option>
          <option
            *ngFor="let predikatKinerja of predikatKinerjaList"
            [value]="predikatKinerja.id"
          >
            {{ predikatKinerja.name }}
          </option>
        </select>
        <div
          *ngIf="
            getErrorMessage('predikatKinerjaId', 'Predikat kinerja') as error
          "
          class="text-danger"
        >
          {{ error }}
        </div>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="mb-3">
        <label for="angkaKredit" class="form-label">
          Angka Kredit <span class="text-danger">*</span>
        </label>
        <input
          type="text"
          class="form-control"
          name="angkaKredit"
          id="angkaKredit"
          formControlName="angkaKredit"
          placeholder="Masukkan angka kredit"
        />
        <div
          *ngIf="getErrorMessage('angkaKredit', 'Angka kredit') as error"
          class="text-danger"
        >
          {{ error }}
        </div>
      </div>
    </div>
    <div class="col-lg-12">
      <div class="row">
        <app-file-handler [inputs]="inputs"></app-file-handler>
      </div>
    </div>
    <div class="col-lg-12">
      <div class="hstack gap-2 justify-content-end">
        <ng-container *ngIf="submitLoading$ | async; else noLoading">
          <button class="btn btn-primary" disabled>
            <div
              class="spinner-border"
              style="width: 19px; height: 19px"
              role="status"
            >
              <span class="visually-hidden">Loading...</span>
            </div>
          </button>
        </ng-container>
        <ng-template #noLoading>
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="rwKinerjaForm.invalid || (submitLoading$ | async)"
          >
            Simpan
          </button>
        </ng-template>
      </div>
    </div>
  </div>
</form>
