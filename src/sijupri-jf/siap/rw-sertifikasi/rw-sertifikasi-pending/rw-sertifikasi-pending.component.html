<app-pagable *ngIf="!isDetailOpen" [pagable]="pagable"></app-pagable>
<div *ngIf="rwSertifikasiLoading$ | async; else akpHadItem" class="d-flex justify-content-center my-5">
    <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>

<ng-template #akpHadItem>
    <form *ngIf="isDetailOpen" [formGroup]="rwSertifikasiForm" (ngSubmit)="submit()">
        <div *ngIf="pendingTask.remark" class="alert alert-warning" role="alert">
            <strong>Catatan Revisi : </strong>"{{ pendingTask.remark }}"
        </div>
        <div class="row">
            <div class="col-lg-12">
                <div class="category-list">
                    <label> Kategori Sertifikasi : </label>
                    <ng-container *ngIf="kategoriLoading$ | async; else noKategoriLoading">
                        <div class="spinner-border spinner-sm-custom" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </ng-container>
                    <ng-template #noKategoriLoading>
                        <div *ngFor="let kategoriSertifikasi of kategoriSertifikasiList">
                            <a (click)="
                  setKategori(kategoriSertifikasi.value, kategoriSertifikasi.id)
                " class="btn" [ngClass]="{
                  'btn-success':
                    (this.kategori$ | async) === kategoriSertifikasi.value,
                  'btn-soft-success':
                    (this.kategori$ | async) !== kategoriSertifikasi.value
                }">{{ kategoriSertifikasi.name }}</a>
                        </div>
                    </ng-template>
                </div>
            </div>
            <ng-container *ngIf="(kategori$ | async) == 1 || (kategori$ | async) == 2">
                <div class="col-lg-6">
                    <div class="mb-3">
                        <label for="noSk" class="form-label">
                            No. SK <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" name="noSk" id="noSk" formControlName="noSk"
                            placeholder="Masukkan nomor SK" />
                        <div *ngIf="getErrorMessage('noSk', 'Nomor SK') as error" class="text-danger">
                            {{ error }}
                        </div>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="mb-3">
                        <label for="tglSk" class="form-label">
                            Tanggal SK <span class="text-danger">*</span>
                        </label>
                        <input type="date" class="form-control" name="tglSk" id="tglSk" formControlName="tglSk" />
                        <div *ngIf="getErrorMessage('tglSk', 'Tanggal SK') as error" class="text-danger">
                            {{ error }}
                        </div>
                    </div>
                </div>
                <div *ngIf="(kategori$ | async) == 2" class="col-lg-6">
                    <div class="mb-3">
                        <label for="wilayahKerja" class="form-label">
                            Wilayah Kerja <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" id="wilayahKerja" formControlName="wilayahKerja"
                            name="wilayahKerja" placeholder="Masukkan wilayah kerja" />
                        <div *ngIf="getErrorMessage('wilayahKerja', 'Wilayah kerja') as error" class="text-danger">
                            {{ error }}
                        </div>
                    </div>
                </div>
                <div *ngIf="(kategori$ | async) == 2" class="col-lg-6">
                    <div class="mb-3">
                        <label for="uuKawalan" class="form-label">
                            UU yang dikawal <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" name="uuKawalan" id="uuKawalan"
                            formControlName="uuKawalan" placeholder="Masukkan UU yang dikawal" />
                        <div *ngIf="getErrorMessage('uuKawalan', 'UU yang dikawal') as error" class="text-danger">
                            {{ error }}
                        </div>
                    </div>
                </div>
                <div *ngIf="(kategori$ | async) == 2" class="col-lg-6">
                    <div class="mb-3">
                        <label for="dateStart" class="form-label">
                            Tanggal Berlaku Mulai <span class="text-danger">*</span>
                        </label>
                        <input type="date" class="form-control" name="dateStart" id="dateStart"
                            formControlName="dateStart" />
                        <div *ngIf="getErrorMessage('dateStart', 'Tanggal mulai') as error" class="text-danger">
                            {{ error }}
                        </div>
                    </div>
                </div>
                <div *ngIf="(kategori$ | async) == 2" class="col-lg-6">
                    <div class="mb-3">
                        <label for="dateEnd" class="form-label">
                            Tanggal Berlaku Sampai <span class="text-danger">*</span>
                        </label>
                        <input type="date" class="form-control" name="dateEnd" id="dateEnd" formControlName="dateEnd" />
                        <div *ngIf="getErrorMessage('dateEnd', 'Tanggal berakhir') as error" class="text-danger">
                            {{ error }}
                        </div>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="row">
                        <ng-container *ngIf="!(kategoriChangeLoading$ | async)">
                            <app-file-handler *ngIf="(kategori$ | async) === 1" [inputs]="inputs"></app-file-handler>
                            <app-file-handler *ngIf="(kategori$ | async) === 2" [inputs]="inputs"></app-file-handler>
                        </ng-container>
                    </div>
                </div>
            </ng-container>
            <div class="col-lg-12">
                <div class="hstack gap-2 justify-content-end">
                    <button type="button" class="btn btn-soft-secondary" (click)="back()">
                        Kembali
                    </button>
                    <ng-container *ngIf="submitLoading$ | async; else noLoading">
                        <button class="btn btn-primary" disabled>
                            <div class="spinner-border spinner-sm-custom" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </button>
                    </ng-container>
                    <ng-template #noLoading>
                        <button type="submit" class="btn btn-primary"
                            [disabled]="rwSertifikasiForm.invalid || (submitLoading$ | async)">
                            Simpan
                        </button>
                    </ng-template>
                </div>
            </div>
        </div>
    </form>
</ng-template>
