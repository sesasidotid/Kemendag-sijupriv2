<form [formGroup]="rwPangkatForm" (ngSubmit)="submit()">
    <div class="row">
        <div class="col-lg-6">
            <div class="mb-3">
                <label for="pangkatCode" class="form-label">
                    Pangkat <span class="text-danger">*</span>
                </label>
                <select disabled *ngIf="!pangkatList || (pangkatListLoading$ | async)" class="form-select">
                    <option selected value="" hidden>
                        Pangkat tidak tersedia
                    </option>
                </select>
                <select *ngIf="pangkatList && !(pangkatListLoading$ | async)" class="form-select" name="pangkatCode"
                    id="pangkatCode" formControlName="pangkatCode">
                    <option selected value="" hidden>Pilih Pangkat</option>
                    <option *ngFor="let pangkat of pangkatList" [value]="pangkat.code">
                        {{ pangkat.name }} ({{ pangkat.golongan }})
                    </option>
                </select>
                <div *ngIf="getErrorMessage('pangkatCode', 'Pangkat') as error" class="text-danger">
                    {{ error }}
                </div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="mb-3">
                <label for="tmt" class="form-label">
                    Terhitung Mulai Tanggal <span class="text-danger">*</span>
                </label>
                <input type="date" class="form-control" name="tmt" id="tmt" formControlName="tmt"
                    placeholder="Masukan nama Sekolah/Universitas/Institusi" />
                <div *ngIf="getErrorMessage('tmt', 'Tanggal mulai') as error" class="text-danger">
                    {{ error }}
                </div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="row">
                <app-file-handler [inputs]="inputs"></app-file-handler>
            </div>
        </div>
        <div class="col-lg-12">
            <div class="hstack gap-2 justify-content-end">
                <ng-container *ngIf="submitLoading$ | async; else noLoading">
                    <button class="btn btn-primary" disabled>
                        <div class="spinner-border spinner-sm-custom" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </button>
                </ng-container>
                <ng-template #noLoading>
                    <button type="submit" class="btn btn-primary"
                        [disabled]="rwPangkatForm.invalid || (submitLoading$ | async)">
                        Simpan
                    </button>
                </ng-template>
            </div>
        </div>
    </div>
</form>
