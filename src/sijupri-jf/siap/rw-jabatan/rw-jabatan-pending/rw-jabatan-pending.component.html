<app-pagable *ngIf="!isDetailOpen" [pagable]="pagable" [refresh]="refresh"></app-pagable>
<div *ngIf="rwJabatanLoading$ | async; else akpHadItem" class="d-flex justify-content-center my-5">
    <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>

<ng-template #akpHadItem>
    <form *ngIf="isDetailOpen" [formGroup]="rwJabatanForm" (ngSubmit)="submit()">
        <div *ngIf="pendingTask.remark" class="alert alert-warning" role="alert">
            <strong>Catatan Revisi : </strong>"{{ pendingTask.remark }}"
        </div>
        <div class="row">
            <div class="col-lg-6">
                <div class="mb-3">
                    <label for="jabatanCode" class="form-label">
                        Jabatan <span class="text-danger">*</span>
                    </label>

                    <select disabled *ngIf="!jabatanList || (jabatanListLoading$ | async)" class="form-select">
                        <option selected value="" hidden>
                            Jabatan tidak tersedia
                        </option>
                    </select>

                    <select *ngIf="jabatanList && !(jabatanListLoading$ | async)" class="form-select" name="jabatanCode"
                        id="jabatanCode" formControlName="jabatanCode">
                        <option selected value="" hidden>
                            Pilih Jabatan
                        </option>
                        <option *ngFor="let jabatan of jabatanList" [value]="jabatan.code">
                            {{ jabatan.name }}
                        </option>
                    </select>
                    <div *ngIf="getErrorMessage('jabatanCode', 'Jabatan') as error" class="text-danger">
                        {{ error }}
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="mb-3 d-flex flex-column">
                    <label for="jenjangCode" class="form-label">
                        Jenjang <span class="text-danger">*</span>
                    </label>
                    <div class="spinner-border" role="status" *ngIf="jenjangLoading$ | async">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <select disabled *ngIf="!jenjangList && !(jenjangLoading$ | async)" class="form-select">
                        <option selected value="" hidden>
                            Jabatan perlu dipilih
                        </option>
                    </select>
                    <select class="form-select" name="jenjangCode" id="jenjangCode" formControlName="jenjangCode"
                        *ngIf="jenjangList && !(jenjangLoading$ | async)">
                        <option selected value="" hidden>
                            Pilih Jenjang
                        </option>
                        <option *ngFor="let jenjang of jenjangList" [value]="jenjang.code" class="text-capitalize">
                            {{ jenjang.name }}
                        </option>
                    </select>
                    <div *ngIf="getErrorMessage('jenjangCode', 'Jenjang') as error" class="text-danger">
                        {{ error }}
                    </div>
                </div>
            </div>
            <div class="row col-lg-12 top-selector">
                <div class="col-lg-6 top-selector">
                    <div class="mb-3">
                        <label for="tmt" class="form-label">
                            Terhitung Mulai Tanggal <span class="text-danger">*</span>
                        </label>
                        <input type="date" class="form-control" name="tmt" id="tmt" formControlName="tmt" />
                        <div *ngIf="getErrorMessage('tmt', 'Tanggal mulai') as error" class="text-danger">
                            {{ error }}
                        </div>
                    </div>
                </div>
                <div class="col-12">
                    <div class="row">
                        <app-file-handler [inputs]="inputs"></app-file-handler>
                        <div *ngIf="
                getErrorMessage(
                  'fileSkJabatan',
                  'File dokumen SK jabatan'
                ) as error
              " class="text-danger">
                            {{ error }}
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-12">
                <div class="hstack gap-2 justify-content-end">
                    <button type="button" class="btn btn-soft-secondary" (click)="back()">
                        Kembali
                    </button>
                    <ng-container *ngIf="submitLoading$ | async; else noLoading">
                        <button class="btn btn-primary" disabled>
                            <div class="spinner-border spinner-sm-custom" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </button>
                    </ng-container>
                    <ng-template #noLoading>
                        <button type="submit" class="btn btn-primary"
                            [disabled]="rwJabatanForm.invalid || (submitLoading$ | async)">
                            Simpan
                        </button>
                    </ng-template>
                </div>
            </div>
        </div>
    </form>
</ng-template>
