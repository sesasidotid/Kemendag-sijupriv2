<form [formGroup]="rwJabatanForm" (ngSubmit)="submit()">
  <div class="row">
    <div class="col-lg-6">
      <div class="mb-3">
        <label for="jabatanCode" class="form-label">
          Jabatan <span class="text-danger">*</span>
        </label>
        <select
          class="form-select"
          name="jabatanCode"
          id="jabatanCode"
          formControlName="jabatanCode"
        >
          <option selected value="" style="display: none">Pilih Jabatan</option>
          <option *ngFor="let jabatan of jabatanList" [value]="jabatan.code">
            {{ jabatan.name }}
          </option>
        </select>
        <div
          *ngIf="getErrorMessage('jabatanCode', 'Jabatan') as error"
          class="text-danger"
        >
          {{ error }}
        </div>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="mb-3 d-flex flex-column">
        <label for="jenjangCode" class="form-label">
          Jenjang <span class="text-danger">*</span>
        </label>
        <div
          class="spinner-border"
          role="status"
          *ngIf="jenjangLoading$ | async"
        >
          <span class="visually-hidden">Loading...</span>
        </div>
        <select
          disabled
          *ngIf="!jenjangList && !(jenjangLoading$ | async)"
          class="form-select"
        >
          <option selected value="" style="display: none">
            Jabatan perlu dipilih
          </option>
        </select>
        <select
          class="form-select"
          name="jenjangCode"
          id="jenjangCode"
          formControlName="jenjangCode"
          *ngIf="jenjangList && !(jenjangLoading$ | async)"
        >
          <option selected value="" style="display: none">Pilih Jenjang</option>
          <option
            *ngFor="let jenjang of jenjangList"
            [value]="jenjang.code"
            style="text-transform: capitalize"
          >
            {{ jenjang.name }}
          </option>
        </select>
        <div
          *ngIf="getErrorMessage('jenjangCode', 'Jenjang') as error"
          class="text-danger"
        >
          {{ error }}
        </div>
      </div>
    </div>
    <div class="row col-lg-6">
      <div class="col-lg-12">
        <div class="mb-3">
          <label for="tmt" class="form-label">
            Terhitung Mulai Tanggal <span class="text-danger">*</span>
          </label>
          <input
            type="date"
            class="form-control"
            name="tmt"
            id="tmt"
            formControlName="tmt"
          />
          <div
            *ngIf="getErrorMessage('tmt', 'Tanggal mulai') as error"
            class="text-danger"
          >
            {{ error }}
          </div>
        </div>
      </div>
      <div class="col-12">
        <div class="row">
          <app-file-handler [inputs]="inputs"></app-file-handler>
          <div
            *ngIf="
              getErrorMessage(
                'fileSkJabatan',
                'File dokumen SK jabatan'
              ) as error
            "
            class="text-danger"
          >
            {{ error }}
          </div>
        </div>
      </div>
    </div>
    <div class="col-lg-12">
      <div class="hstack gap-2 justify-content-end">
        <ng-container *ngIf="submitLoading$ | async; else noLoading">
          <button class="btn btn-primary" disabled>
            <div
              class="spinner-border"
              style="width: 19px; height: 19px"
              role="status"
            >
              <span class="visually-hidden">Loading...</span>
            </div>
          </button>
        </ng-container>
        <ng-template #noLoading>
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="rwJabatanForm.invalid || (submitLoading$ | async)"
          >
            Simpan
          </button>
        </ng-template>
      </div>
    </div>
  </div>
</form>
