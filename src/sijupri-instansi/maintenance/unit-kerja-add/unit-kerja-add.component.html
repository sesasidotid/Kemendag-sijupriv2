<div class="row">
  <div class="col-lg-8">
    <form [formGroup]="unitKerjaForm" (ngSubmit)="submit()">
      <div class="row mb-3">
        <label for="" class="col-sm-2 col-form-label fw-bold">Instansi</label>
        <div class="col-sm-10">
          <div
            *ngIf="loadingInstansi$ | async; else instansiHadItem"
            class="d-flex"
          >
            <div class="spinner-border" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>

          <ng-template #instansiHadItem>
            <p class="pt-2">
              <b>{{ instansi.name }}</b>
            </p>
          </ng-template>
        </div>
      </div>

      <div *ngIf="provinsi || (loadingProvinsi$ | async)" class="row mb-3">
        <label for="" class="col-sm-2 col-form-label fw-bold">Provinsi</label>
        <div class="col-sm-10">
          <div
            *ngIf="loadingProvinsi$ | async; else provinsiHadItem"
            class="d-flex"
          >
            <div class="spinner-border" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>

          <ng-template #provinsiHadItem>
            <p class="pt-2">
              <b>{{ provinsi.name }}</b>
            </p>
          </ng-template>
        </div>
      </div>

      <div *ngIf="kabKota || (loadingKabKota$ | async)" class="row mb-3">
        <label for="" class="col-sm-2 col-form-label fw-bold"
          >Kabupaten/Kota</label
        >
        <div class="col-sm-10">
          <div
            *ngIf="loadingKabKota$ | async; else kabKotaHadItem"
            class="d-flex"
          >
            <div class="spinner-border" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>

          <ng-template #kabKotaHadItem>
            <p class="pt-2">
              <b>{{ kabKota.name }}</b>
            </p>
          </ng-template>
        </div>
      </div>
      <hr />
      <div class="row mb-3">
        <label for="" class="col-sm-2 col-form-label fw-bold"
          >Nama
          <span class="text-danger">*</span>
        </label>
        <div class="col-sm-10">
          <input
            type="text"
            class="form-control"
            name="name"
            id="name"
            formControlName="name"
          />
          <div
            *ngIf="getErrorMessage('name', 'Nama') as error"
            class="text-danger"
          >
            {{ error }}
          </div>
        </div>
      </div>

      <div class="row mb-3">
        <label for="" class="col-sm-2 col-form-label fw-bold"
          >Email
          <span class="text-danger">*</span>
        </label>
        <div class="col-sm-10">
          <input
            type="email"
            class="form-control"
            name="email"
            id="email"
            formControlName="email"
          />
          <div
            *ngIf="getErrorMessage('email', 'Email') as error"
            class="text-danger"
          >
            {{ error }}
          </div>
        </div>
      </div>

      <div class="row mb-3">
        <label for="" class="col-sm-2 col-form-label fw-bold"
          >Telp
          <span class="text-danger">*</span>
        </label>
        <div class="col-sm-10">
          <input
            type="text"
            class="form-control"
            name="phone"
            id="phone"
            formControlName="phone"
          />
          <div
            *ngIf="getErrorMessage('phone', 'Telp') as error"
            class="text-danger"
          >
            {{ error }}
          </div>
        </div>
      </div>
      <div class="row mb-3">
        <label for="" class="col-sm-2 col-form-label fw-bold"
          >Alamat
          <span class="text-danger">*</span>
        </label>
        <div class="col-sm-10">
          <input
            type="text"
            class="form-control"
            name="alamat"
            id="alamat"
            formControlName="alamat"
          />
          <div
            *ngIf="getErrorMessage('alamat', 'Alamat') as error"
            class="text-danger"
          >
            {{ error }}
          </div>
        </div>
      </div>

      <div class="row mb-3">
        <label for="" class="col-sm-2 col-form-label fw-bold"
          >Wilayah
          <span class="text-danger">*</span>
        </label>
        <div class="col-sm-10">
          <select
            id="inputState"
            class="form-select"
            name="wilayahCode"
            id="wilayahCode"
            formControlName="wilayahCode"
          >
            <option selected value="" style="display: none">
              Pilih Wilayah
            </option>
            <option
              *ngFor="let wilayahList of wilayahList"
              [value]="wilayahList.code"
            >
              {{ wilayahList.name }}
            </option>
          </select>
          <div
            *ngIf="getErrorMessage('wilayahCode', 'Wilayah') as error"
            class="text-danger"
          >
            {{ error }}
          </div>
        </div>
      </div>
      <div
        *ngIf="
          !(loadingKabKota$ | async) &&
          ((kabKotaName$ | async) ||
            (provinceName$ | async) ||
            instansi?.kotaId)
        "
        class="alert alert-warning"
        role="alert"
      >
        Jangan lupa memilih titik lokasi pada peta.
      </div>
      <div class="text-center float-end">
        <button
          type="submit"
          class="btn btn-success"
          [disabled]="unitKerjaForm.invalid"
        >
          Simpan
        </button>
      </div>
    </form>
  </div>

  <div
    class="col-lg-4 mt-3 mt-lg-0"
    *ngIf="
      !(loadingKabKota$ | async) &&
      ((kabKotaName$ | async) ||
        (provinceName$ | async) ||
        instansi?.kotaId ||
        instansi)
    "
  >
    <app-map
      (coordinates)="onCoordinatesReceived($event)"
      [name]="
        instansi?.kabupatenId || instansi?.kotaId
          ? (kabKotaName$ | async)
          : (provinceName$ | async) || 'indonesia'
      "
      [type]="
        instansi?.kabupatenId || instansi?.kotaId
          ? 'kabupaten'
          : (provinceName$ | async)
          ? 'provinsi'
          : 'indonesia'
      "
    >
    </app-map>
  </div>
</div>
