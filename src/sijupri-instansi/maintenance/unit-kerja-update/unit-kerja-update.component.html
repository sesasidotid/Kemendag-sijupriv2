<div class="row">
    <div [ngClass]="true ? 'col-lg-8' : 'col-lg-12'">
        <form [formGroup]="updateUnitKerjaForm" (ngSubmit)="submit()">
            <div class="row mb-3">
                <label for="" class="col-sm-2 col-form-label fw-bold">
                    Nama
                    <span class="text-danger">*</span>
                </label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" name="name" id="name" formControlName="name" />
                    <div *ngIf="getErrorMessage('name', 'Nama') as error" class="text-danger">
                        {{ error }}
                    </div>
                </div>
            </div>

            <div class="row mb-3">
                <label for="" class="col-sm-2 col-form-label fw-bold">
                    Email
                    <span class="text-danger">*</span>
                </label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" name="email" id="email" formControlName="email" />
                    <div *ngIf="getErrorMessage('email', 'Email') as error" class="text-danger">
                        {{ error }}
                    </div>
                </div>
            </div>

            <div class="row mb-3">
                <label for="" class="col-sm-2 col-form-label fw-bold">
                    Telp
                    <span class="text-danger">*</span>
                </label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" name="phone" id="phone" formControlName="phone" />
                    <div *ngIf="getErrorMessage('phone', 'Telp') as error" class="text-danger">
                        {{ error }}
                    </div>
                </div>
            </div>

            <div class="row mb-3">
                <label for="" class="col-sm-2 col-form-label fw-bold">Alamat
                    <span class="text-danger">*</span>
                </label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" name="alamat" id="alamat" formControlName="alamat" />
                    <div *ngIf="getErrorMessage('alamat', 'Alamat') as error" class="text-danger">
                        {{ error }}
                    </div>
                </div>
            </div>
            <div class="row mb-3">
                <label for="" class="col-sm-2 col-form-label fw-bold">
                    Wilayah <span class="text-danger">*</span>
                </label>
                <div class="col-sm-10">
                    <select id="inputState" class="form-select" name="wilayah_code" id="wilayah_code"
                        formControlName="wilayah_code">
                        <option selected value="" hidden>
                            Pilih Wilayah
                        </option>
                        <option *ngFor="let wilayah of wilayahList" [value]="wilayah.code">
                            {{ wilayah.name }}
                        </option>
                    </select>
                    <div *ngIf="getErrorMessage('wilayahCode', 'Wilayah') as error" class="text-danger">
                        {{ error }}
                    </div>
                </div>
            </div>

            <div class="alert alert-warning" role="alert">
                Pilih titik lokasi pada peta.
            </div>

            <div class="text-center float-end">
                <button type="submit" class="btn btn-success" [disabled]="updateUnitKerjaForm.invalid">
                    Simpan
                </button>
            </div>
        </form>
    </div>

    <div class="col-lg-4 mt-3 mt-lg-0">
        <app-map *ngIf="
        updateUnitKerjaForm.get('latitude').value &&
        updateUnitKerjaForm.get('longitude').value
      " (coordinates)="onCoordinatesReceived($event)" [name]="'indonesia'" [type]="'indonesia'"
            [defaultLat]="updateUnitKerjaForm.get('latitude').value"
            [defaultLng]="updateUnitKerjaForm.get('longitude').value">
        </app-map>
    </div>
</div>
