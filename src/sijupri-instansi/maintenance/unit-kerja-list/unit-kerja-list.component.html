<app-pagable [pagable]="pagable" [refresh]="refresh"></app-pagable>

<app-modal
  *ngIf="isModalOpen$ | async"
  [title]="'Update Data Unit Kerja'"
  (toggle)="toggleModal()"
  [enableFooter]="false"
  [size]="'lg'"
>
  <app-unit-kerja-update
    [id]="unitKerja.id"
    (submitComplete)="handleModalClose()"
  ></app-unit-kerja-update>
</app-modal>
