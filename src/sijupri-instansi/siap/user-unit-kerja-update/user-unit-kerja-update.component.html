<form [formGroup]="updateUserUnitKerja" (ngSubmit)="submit()">
    <div class="row mb-3">
        <label for="" class="col-sm-2 col-form-label fw-bold">Nama
            <span class="text-danger">*</span>
        </label>
        <div class="col-sm-10">
            <input type="text" class="form-control" name="name" id="name" formControlName="name" />
            <div *ngIf="getErrorMessage('name', 'Name') as error" class="text-danger">
                {{ error }}
            </div>
        </div>
    </div>

    <div class="row mb-3">
        <label for="" class="col-sm-2 col-form-label fw-bold">Email
            <span class="text-danger">*</span>
        </label>
        <div class="col-sm-10">
            <input type="email" class="form-control" name="email" id="email" formControlName="email" />
            <div *ngIf="getErrorMessage('email', 'Email') as error" class="text-danger">
                {{ error }}
            </div>
        </div>
    </div>

    <div class="row mb-3">
        <label for="" class="col-sm-2 col-form-label fw-bold">Unit Kerja
            <span class="text-danger">*</span>
        </label>
        <div class="col-sm-10">
            <select id="inputState" class="form-select" name="unit_kerja_id" id="unit_kerja_id"
                formControlName="unit_kerja_id">
                <option selected value="" hidden>
                    Pilih Unit Kerja
                </option>
                <option *ngFor="let unitKerja of unitKerjaList" [value]="unitKerja.id">
                    {{ unitKerja.name }}
                </option>
            </select>
            <div *ngIf="getErrorMessage('unit_kerja_id', 'Unit Kerja') as error" class="text-danger">
                {{ error }}
            </div>
        </div>
    </div>

    <div class="row">
        <div class="text-center col">
            <ng-container *ngIf="submitLoading$ | async; else noLoading">
                <button class="btn btn-success float-end" disabled>
                    <div class="spinner-border spinner-sm-custom" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </button>
            </ng-container>
            <ng-template #noLoading>
                <button type="submit" class="btn btn-success float-end"
                    [disabled]="updateUserUnitKerja.invalid || (submitLoading$ | async)">
                    Simpan
                </button>
            </ng-template>
            <!-- <button
        type="submit"
        class="btn btn-primary float-end"
        [disabled]="updateUserUnitKerja.invalid"
      >
        Simpan
      </button> -->
        </div>
    </div>
</form>
