<form [formGroup]="unitKerjaForm" (ngSubmit)="submit()">
    <div class="row mb-3">
        <label for="" class="col-sm-2 col-form-label fw-bold"
            >NIP <span class="text-danger">*</span>
        </label>
        <div class="col-sm-10">
            <input
                type="text"
                class="form-control"
                name="nip"
                id="nip"
                formControlName="nip"
            />
            <div
                *ngIf="getErrorMessage('nip', 'NIP') as error"
                class="text-danger"
            >
                {{ error }}
            </div>
        </div>
    </div>

    <div class="row mb-3">
        <label for="" class="col-sm-2 col-form-label fw-bold"
            >Nama <span class="text-danger">*</span>
        </label>
        <div class="col-sm-10">
            <input
                type="text"
                class="form-control"
                name="name"
                id="name"
                formControlName="name"
            />
            <div
                *ngIf="getErrorMessage('name', 'Nama') as error"
                class="text-danger"
            >
                {{ error }}
            </div>
        </div>
    </div>

    <div class="row mb-3">
        <label for="" class="col-sm-2 col-form-label fw-bold"
            >Email <span class="text-danger">*</span>
        </label>
        <div class="col-sm-10">
            <input
                type="email"
                class="form-control"
                name="email"
                id="email"
                formControlName="email"
            />
            <div
                *ngIf="getErrorMessage('email', 'Email') as error"
                class="text-danger"
            >
                {{ error }}
            </div>
        </div>
    </div>

    <div class="row mb-3">
        <label for="" class="col-sm-2 col-form-label fw-bold"
            >Unit Kerja <span class="text-danger">*</span>
        </label>
        <div class="col-sm-10">
            <select
                class="form-select"
                name="unitKerja"
                id="unitKerja"
                formControlName="unitKerja"
            >
                <option selected value="" style="display: none">
                    Pilih Unit Kerja
                </option>

                <option
                    *ngFor="let unitKerja of unitKerjaList"
                    [value]="unitKerja.id"
                >
                    {{ unitKerja.name }}
                </option>

                <ng-container
                    *ngIf="unitKerjaList.length != 0; else unitKerjaNotFound"
                >
                    <option
                        *ngFor="let unitKerja of unitKerjaList"
                        [value]="unitKerja.id"
                    >
                        {{ unitKerja.name }}
                    </option>
                </ng-container>
                <ng-template #unitKerjaNotFound>
                    <option disabled>Unit Kerja tidak ditemukan</option>
                </ng-template>
            </select>
            <div
                *ngIf="getErrorMessage('unitKerja', 'Unit Kerja') as error"
                class="text-danger"
            >
                {{ error }}
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-12">
            <app-loading-button
                [isLoading]="createLoading$ | async"
                [disabled]="unitKerjaForm.invalid"
                [type]="'submit'"
                label="Simpan"
                [className]="'btn btn-success float-end'"
            ></app-loading-button>
        </div>
    </div>
</form>
