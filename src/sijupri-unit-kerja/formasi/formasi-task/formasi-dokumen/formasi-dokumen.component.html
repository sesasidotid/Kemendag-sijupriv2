<form (submit)="submit()">
    <div class="row">
        <div class="col-lg-12">
            <app-file-handler [inputs]="inputs"></app-file-handler>
        </div>

        <div class="text-center col">
            <button type="submit" class="btn btn-success float-end" [disabled]="isAnyFileMissing()"
                *ngIf="!(hadItemsLoading$ | async)">
                Simpan
            </button>

            <button *ngIf="hadItemsLoading$ | async" class="btn btn-success float-end" disabled>
                <div class="spinner-border spinner-sm-custom" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </button>
        </div>
    </div>
</form>
