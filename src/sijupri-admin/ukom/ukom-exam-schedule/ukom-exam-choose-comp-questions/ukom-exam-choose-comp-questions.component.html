<script src="../ukom-exam-makalah/ukom-exam-makalah.component.ts"></script>
<div class="d-flex align-items-center mb-3">
    <button (click)="back()" class="btn btn-sm btn-outline-secondary me-3">
        <i class="mdi mdi-chevron-left"></i> Kembali
    </button>
</div>

<ng-container *ngIf="isLoading$ | async; else ukomExamContent">
    <div class="d-flex justify-content-center my-5">
        <div class="spinner-border" role="status"></div>
    </div>
</ng-container>

<ng-template #ukomExamContent>
    <div class="d-flex flex-column gap-4">
        <div class="card">
            <div class="card-header fw-semibold">Informasi Ujian</div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label text-muted small"
                            >Nama Kelas</label
                        >
                        <div class="fw-semibold fs-5">
                            {{ roomUkomDetail.name }}
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label text-muted small"
                            >Waktu Mulai</label
                        >
                        <div>
                            {{ examDetail()?.startTime | tanggalWaktuIndo }}
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label text-muted small"
                            >Waktu Selesai</label
                        >
                        <div>
                            {{ examDetail()?.endTime | tanggalWaktuIndo }}
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label text-muted small"
                            >Jenis Ujian</label
                        >
                        <div>{{ examDetail()?.examTypeCode }}</div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label text-muted small"
                            >Durasi</label
                        >
                        <div>{{ examDetail()?.duration | duration }}</div>
                    </div>
                </div>
            </div>
        </div>

        <ng-container *ngIf="examinerList().length > 0">
            <div class="card">
                <div class="card-header fw-semibold">Daftar Penguji</div>
                <div class="card-body p-0">
                    <ag-grid-angular
                        [columnDefs]="columnDefs"
                        [defaultColDef]="defaultColDef"
                        [rowData]="examinerList()"
                        [style.height]="calculateGridHeight()"
                        [suppressCellFocus]="true"
                        class="ag-theme-alpine"
                    ></ag-grid-angular>
                </div>
            </div>
        </ng-container>

        <ng-container *ngIf="typeUkom() === ExamTypeCategory.CAT">
            <app-ukom-exam-cat
                [examDetail]="examDetail()"
                [roomUkomDetail]="roomUkomDetail"
            ></app-ukom-exam-cat>
        </ng-container>

        <ng-container *ngIf="typeUkom() === ExamTypeCategory.WAWANCARA">
            <app-ukom-exam-wawancara
                [examDetail]="examDetail()"
                [examinerList]="examinerList()"
                [roomUkomDetail]="roomUkomDetail"
            ></app-ukom-exam-wawancara>
        </ng-container>

        <ng-container *ngIf="typeUkom() === ExamTypeCategory.MAKALAH">
            <app-ukom-exam-makalah
                [examinerList]="examinerList()"
            ></app-ukom-exam-makalah>
        </ng-container>
    </div>
</ng-template>
