<div *ngIf="isLoading$ | async; else ukomExamContent" class="d-flex justify-content-center my-5">
    <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>

<ng-template #ukomExamContent>
    <button class="btn btn-sm btn-outline-secondary mb-3" (click)="back()">
        <i class="mdi mdi-chevron-left"></i> Kembali
    </button>

    <section>
        <div class="row mb-3">
            <label for="" class="col-sm-2 col-form-label fw-bold">Nama Kelas</label>
            <div class="col-sm-10 pt-2">
                <p>: {{ roomUkomDetail.name }}</p>
            </div>
        </div>

        <div class="row mb-3">
            <label for="name" class="col-sm-2 col-form-label fw-bold">
                Waktu Mulai
            </label>
            <div class="col-sm-10 pt-2">
                <p>: {{ examDetail.startTime | tanggalWaktuIndo }}</p>
            </div>
        </div>

        <div class="row mb-3">
            <label for="name" class="col-sm-2 col-form-label fw-bold">
                Waktu Selesai
            </label>
            <div class="col-sm-10 pt-2">
                <p>: {{ examDetail.endTime | tanggalWaktuIndo }}</p>
            </div>
        </div>

        <div class="row mb-3">
            <label for="name" class="col-sm-2 col-form-label fw-bold">
                Jenis Ujian
            </label>
            <div class="col-sm-10 pt-2">
                <p>: {{ examDetail.examTypeCode }}</p>
            </div>
        </div>
    </section>

    <ng-container *ngIf="type_ukom === 'CAT'">
        <app-ukom-exam-cat [room_ukom_detail]="roomUkomDetail" [exam_detail]="examDetail"></app-ukom-exam-cat>
    </ng-container>

    <ng-container *ngIf="type_ukom === 'MAKALAH'">
        <app-ukom-exam-makalah [room_ukom_detail]="roomUkomDetail" [exam_detail]="examDetail"></app-ukom-exam-makalah>
    </ng-container>
</ng-template>
