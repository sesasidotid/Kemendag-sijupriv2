<ng-container *ngIf="isLoading$ | async; else ukomExamContent">
    <div class="d-flex justify-content-center my-5">
        <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
</ng-container>

<ng-template #ukomExamContent>
    <button (click)="back()" class="btn btn-sm btn-outline-secondary mb-3">
        <i class="mdi mdi-chevron-left"></i> Kembali
    </button>

    <section class="d-flex flex-column gap-4">
        <section class="d-flex flex-column gap-4">
            <div>
                <label class="form-label text-muted">Nama Kelas</label>
                <div class="fs-5 fw-semibold">{{ roomUkomDetail.name }}</div>
            </div>

            <div>
                <label class="form-label text-muted">Waktu Mulai</label>
                <div class="fs-5 fw-semibold">
                    {{ examDetail.startTime | tanggalWaktuIndo }}
                </div>
            </div>

            <div>
                <label class="form-label text-muted">Waktu Selesai</label>
                <div class="fs-5 fw-semibold">
                    {{ examDetail.endTime | tanggalWaktuIndo }}
                </div>
            </div>

            <div>
                <label class="form-label text-muted">Jenis Ujian</label>
                <div class="fs-5 fw-semibold">
                    {{ examDetail.examTypeCode }}
                </div>
            </div>

            <div>
                <label class="form-label text-muted">Durasi</label>
                <div class="fs-5 fw-semibold">
                    {{ examDetail.duration | duration }}
                </div>
            </div>
        </section>

        <ng-container *ngIf="typeUkom === 'CAT'">
            <app-ukom-exam-cat
                [examDetail]="examDetail"
                [roomUkomDetail]="roomUkomDetail"
            ></app-ukom-exam-cat>
        </ng-container>

        <!--        <ng-container *ngIf="typeUkom === 'MAKALAH'">-->
        <!--            <app-ukom-exam-makalah-->
        <!--                [examDetail]="examDetail"-->
        <!--                [roomUkomDetail]="roomUkomDetail"-->
        <!--            ></app-ukom-exam-makalah>-->
        <!--        </ng-container>-->

        <ng-container *ngIf="typeUkom === 'WAWANCARA'">
            <app-ukom-exam-wawancara
                [examDetail]="examDetail"
                [roomUkomDetail]="roomUkomDetail"
            ></app-ukom-exam-wawancara>
        </ng-container>
    </section>
</ng-template>
