<div class="d-flex align-items-center mb-3">
    <button (click)="back()" class="btn btn-sm btn-outline-secondary me-3">
        <i class="mdi mdi-chevron-left"></i> Kembali
    </button>
</div>

<ng-container *ngIf="isLoading(); else ukomExamContent">
    <div class="d-flex justify-content-center my-5">
        <div class="spinner-border" role="status"></div>
    </div>
</ng-container>

<ng-template #ukomExamContent>
    <div class="d-flex flex-column gap-4">
        <div class="card">
            <div class="card-header fw-semibold">Informasi Ujian</div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label text-muted small"
                            >Nama Kelas</label
                        >
                        <div class="fw-semibold fs-5">
                            {{ roomUkomDetail.name }}
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label text-muted small"
                            >Waktu Mulai</label
                        >
                        <div>
                            {{ examDetail()?.startTime | tanggalWaktuIndo }}
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label text-muted small"
                            >Waktu Selesai</label
                        >
                        <div>
                            {{ examDetail()?.endTime | tanggalWaktuIndo }}
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label text-muted small"
                            >Jenis Ujian</label
                        >
                        <div>
                            {{ukomMiscellaneousService.getModuleDisplayName(examDetail()?.examTypeCode)
                            }}
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label text-muted small"
                            >Durasi</label
                        >
                        <div>{{ examDetail()?.duration | duration }}</div>
                    </div>

                    <div class="col-12">
                        <div class="d-flex gap-2">
                            <button
                                (click)="openExaminerListModal()"
                                class="btn btn-info"
                                type="button"
                            >
                                <i class="mdi mdi-account-tie me-2"></i>
                                Lihat Daftar Penguji ({{ examinerList().length
                                }})
                            </button>
                            <button
                                (click)="openParticipantListModal()"
                                class="btn btn-primary"
                                type="button"
                            >
                                <i class="mdi mdi-account-multiple me-2"></i>
                                Lihat Daftar Peserta ({{
                                participantList().length }})
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <ng-container *ngIf="typeUkom() === ExamTypeCategory.CAT">
            <app-ukom-exam-cat
                [examDetail]="examDetail()"
                [roomUkomDetail]="roomUkomDetail"
            ></app-ukom-exam-cat>
        </ng-container>

        <ng-container *ngIf="typeUkom() === ExamTypeCategory.WAWANCARA">
            <app-ukom-exam-wawancara
                (participantListRefresh)="refreshParticipantList()"
                [examDetail]="examDetail()"
                [examinerList]="examinerList()"
                [participantList]="participantList()"
                [roomUkomDetail]="roomUkomDetail"
            ></app-ukom-exam-wawancara>
        </ng-container>

        <ng-container *ngIf="typeUkom() === ExamTypeCategory.MAKALAH">
            <app-ukom-exam-makalah
                (participantListRefresh)="refreshParticipantList()"
                [examinerList]="examinerList()"
                [participantList]="participantList()"
            ></app-ukom-exam-makalah>
        </ng-container>
    </div>
</ng-template>

<!-- Examiner List Modal -->
<app-examiner-list-modal
    (close)="closeExaminerListModal()"
    *ngIf="showExaminerListModal()"
    [examTypeCode]="typeUkom()"
    [examinerList]="examinerList()"
>
</app-examiner-list-modal>

<!-- Participant List Modal -->
<app-participant-list-modal
    (close)="closeParticipantListModal()"
    *ngIf="showParticipantListModal()"
    [examTypeCode]="typeUkom()"
    [participantList]="participantList()"
>
</app-participant-list-modal>
