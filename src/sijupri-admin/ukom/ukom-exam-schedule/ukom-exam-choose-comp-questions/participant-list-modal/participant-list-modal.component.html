<app-modal (toggle)="onClose()" [enableFooter]="false" [size]="'xl'" [title]="'Daftar Peserta ' + examTypeCode">
    <div class="participant-list-content">
        <div class="alert alert-info mb-3">
            <i class="mdi mdi-information-outline me-2"></i>
            <strong>Total Peserta:</strong> {{ participantList.length }} orang
        </div>

        <div *ngIf="participantList.length === 0" class="alert alert-warning">
            <i class="bi bi-exclamation-triangle me-2"></i>
            Tidak ada peserta terdaftar untuk ujian ini.
        </div>

        <ag-grid-angular (gridReady)="onGridReady($event)" *ngIf="participantList.length > 0" [columnDefs]="columnDefs"
            [defaultColDef]="defaultColDef" [pagination]="true" [paginationPageSize]="20" [rowData]="participantList"
            [suppressCellFocus]="true" class="ag-theme-alpine" style="height: 500px; width: 100%">
        </ag-grid-angular>
    </div>
</app-modal>
