<section>
  <form [formGroup]="examScheduleForm" (ngSubmit)="submit()">
    <div formArrayName="schedules">
      <div
        *ngFor="let schedule of schedules.controls; let i = index"
        [formGroupName]="i"
      >
        <div>
          <div class="d-flex justify-content-between align-items-center mb-2">
            <label for="" class="col-form-label fw-bold"
              >Jadwal {{ i + 1 }}</label
            >
            <a
              class="btn btn-sm btn-soft-danger"
              *ngIf="i > 0"
              (click)="removeSchedule(i)"
              >Hapus</a
            >
          </div>
          <div class="row mb-3">
            <label class="col-sm-2 col-form-label fw-bold"
              >Waktu Mulai <span class="text-danger">*</span></label
            >
            <div class="col-sm-10">
              <input
                type="datetime-local"
                formControlName="start_time"
                class="form-control"
              />
              <div
                class="text-danger"
                *ngIf="getScheduleError(i, 'start_time', 'Waktu Mulai')"
              >
                {{ getScheduleError(i, 'start_time', 'Waktu Mulai') }}
              </div>
            </div>
          </div>
          <div class="row mb-3">
            <label class="col-sm-2 col-form-label fw-bold"
              >Waktu Selesai <span class="text-danger">*</span></label
            >
            <div class="col-sm-10">
              <input
                type="datetime-local"
                formControlName="end_time"
                class="form-control"
              />
              <div
                class="text-danger"
                *ngIf="getScheduleError(i, 'end_time', 'Waktu Selesai')"
              >
                {{ getScheduleError(i, 'end_time', 'Waktu Selesai') }}
              </div>
            </div>
          </div>
          <div class="row mb-3">
            <label class="col-sm-2 col-form-label fw-bold"
              >Jenis UKom <span class="text-danger">*</span></label
            >
            <div class="col-sm-10">
              <select formControlName="exam_type_code" class="form-select">
                <option value="" disabled selected hidden>
                  Pilih Jenis UKom
                </option>
                <option
                  *ngFor="let jenisUkom of jenisUkomList$ | async"
                  [value]="jenisUkom.code"
                >
                  {{ jenisUkom.name }}
                </option>
              </select>
              <div
                class="text-danger"
                *ngIf="getScheduleError(i, 'exam_type_code', 'Jenis UKom')"
              >
                {{ getScheduleError(i, 'exam_type_code', 'Jenis UKom') }}
              </div>
            </div>
          </div>
          
          <div class="row mb-3" *ngIf="isCatExamType(i)">
            <label class="col-sm-2 col-form-label fw-bold"
              >Durasi <span class="text-danger">*</span></label
            >
            <div class="col-sm-10">
              <div class="input-group">
                <input
                  type="number"
                  formControlName="duration"
                  class="form-control"
                  placeholder="Masukkan durasi"
                  min="1"
                />
                <span class="input-group-text">menit</span>
              </div>
              <div
                class="text-danger"
                *ngIf="getScheduleError(i, 'duration', 'Durasi')"
              >
                {{ getScheduleError(i, 'duration', 'Durasi') }}
              </div>
              <small class="form-text text-muted">
                Durasi ujian CAT dalam menit
              </small>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="row text-center">
      <div class="col-12">
        <ng-container *ngIf="submitLoading$ | async; else noLoading">
          <button class="btn btn-primary float-end" disabled>
            <div
              class="spinner-border"
              style="width: 19px; height: 19px"
              role="status"
            >
              <span class="visually-hidden">Loading...</span>
            </div>
          </button>
        </ng-container>
        <ng-template #noLoading>
          <div class="d-flex mb-3 justify-content-end gap-1">
            <div>
              <button
                type="button"
                class="btn btn-secondary"
                *ngIf="(jenisUkomList$ | async)?.length > schedules.length"
                (click)="addSchedule()"
              >
                Tambah Jadwal
              </button>
            </div>
            <div>
              <button
                type="submit"
                class="btn btn-primary"
                [disabled]="
                  examScheduleForm.invalid || (submitLoading$ | async)
                "
              >
                Simpan
              </button>
            </div>
          </div>
        </ng-template>
      </div>
    </div>
  </form>
  <app-pagable [pagable]="pagable" [refresh]="refreshToggle"></app-pagable>
</section>
