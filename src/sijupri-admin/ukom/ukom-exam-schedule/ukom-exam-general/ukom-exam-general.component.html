<div class="general-exam-container">
    <div
        *ngIf="participantsWithExaminers().length > 0; else noParticipants"
        class="grid-section"
    >
        <ag-grid-angular
            (gridReady)="onGridReady($event)"
            [columnDefs]="columnDefs"
            [defaultColDef]="defaultColDef"
            [paginationPageSize]="20"
            [pagination]="true"
            [rowData]="participantsWithExaminers()"
            [style.height.px]="600"
            [style.width.%]="100"
            [suppressCellFocus]="true"
            class="ag-theme-alpine"
        >
        </ag-grid-angular>
    </div>
    <ng-template #noParticipants>
        <div class="alert alert-info text-center">
            <i class="mdi mdi-information-outline me-2"></i>
            Belum ada peserta terdaftar untuk ujian ini.
        </div>
    </ng-template>
</div>
<app-update-examiner-modal
    (close)="closeExaminerModal()"
    (confirm)="confirmExaminerUpdate($event)"
    *ngIf="showExaminerModal() && selectedParticipant()"
    [examinerList]="examinerList()"
    [participant]="selectedParticipant()!"
>
</app-update-examiner-modal>
