<form (ngSubmit)="submit()" [formGroup]="templatePertanyaanForm">
    <div class="col-lg-12 mb-3">
        <label class="form-label fw-bold" for="jenisUkomInput"
            >Jenis UKom <span class="text-danger">*</span>
        </label>
        <select
            appInvalidOnTouch
            class="form-select"
            formControlName="jenis_ukom_code"
            id="jenis_ukom_code"
            name="jenis_ukom_code"
        >
            <option disabled hidden selected value="">Pilih Jenis UKom</option>
            <option
                *ngFor="let jenisUkom of examTypeList$ | async"
                [value]="jenisUkom.code"
            >
                {{ jenisUkom.code }}
            </option>
        </select>
        <div
            *ngIf="getErrorMessage('jenis_ukom_code', 'Jenis UKom') as error"
            class="invalid-feedback"
        >
            {{ error }}
        </div>
    </div>

    <div class="col-lg-12">
        <div class="row">
            <app-file-handler [inputs]="inputs"></app-file-handler>
        </div>
    </div>

    <div class="row text-center">
        <div class="col-12">
            <ng-container *ngIf="isLoading$ | async; else noLoading">
                <button class="btn btn-success float-end" disabled>
                    <div class="spinner-border spinner-sm-custom" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </button>
            </ng-container>

            <ng-template #noLoading>
                <button
                    [disabled]="isAnyFileMissing() || templatePertanyaanForm.invalid"
                    class="btn btn-success float-end"
                    type="submit"
                >
                    Import
                </button>
            </ng-template>
        </div>
    </div>
</form>
