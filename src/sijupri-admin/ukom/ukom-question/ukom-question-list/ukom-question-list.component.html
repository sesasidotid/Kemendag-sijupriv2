<section>
  <form [formGroup]="templatePertanyaanForm" (ngSubmit)="submit()">
    <div class="col-lg-12 mb-3">
      <label for="jenisUkomInput"
        >Jenis UKom <span class="text-danger">*</span>
      </label>
      <select
        id="jenis_ukom_code"
        name="jenis_ukom_code"
        class="form-select"
        formControlName="jenis_ukom_code"
      >
        <option value="" disabled selected hidden>Pilih Jenis UKom</option>
        <option
          *ngFor="let jenisUkom of examTypeList$ | async"
          [value]="jenisUkom.code"
        >
          {{ jenisUkom.code }}
        </option>
      </select>
      <div
        *ngIf="getErrorMessage('jenis_ukom_code', 'Jenis UKom') as error"
        class="text-danger"
      >
        {{ error }}
      </div>
    </div>

    <div class="col-lg-12">
      <div class="row">
        <app-file-handler [inputs]="inputs"></app-file-handler>
      </div>
    </div>

    <div class="row text-center">
      <div class="col-12">
        <ng-container *ngIf="isLoading$ | async; else noLoading">
          <button class="btn btn-success float-end" disabled>
            <div
              class="spinner-border"
              style="width: 19px; height: 19px"
              role="status"
            >
              <span class="visually-hidden">Loading...</span>
            </div>
          </button>
        </ng-container>

        <ng-template #noLoading>
          <button
            type="submit"
            class="btn btn-success float-end"
            [disabled]="isAnyFileMissing() || templatePertanyaanForm.invalid"
          >
            Import
          </button>
        </ng-template>
      </div>
    </div>
  </form>
</section>
