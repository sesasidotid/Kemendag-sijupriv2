<div class="row g-3 mb-4">
    <div class="col-12 col-md-6">
        <label class="form-label">Jabatan</label>
        <select class="form-select" [ngModel]="selectedJabatan()" (ngModelChange)="selectedJabatan.set($event); onJabatanChange()">
            <option [ngValue]="null">Pilih Jabatan</option>
            <option *ngFor="let jab of jabatanList()" [ngValue]="jab.code">{{ jab.name }}</option>
        </select>
    </div>

    <div class="col-12 col-md-6">
        <label class="form-label">Jenjang</label>
        <select class="form-select" [ngModel]="selectedJenjang()" (ngModelChange)="selectedJenjang.set($event); onJenjangChange()" [disabled]="!selectedJabatan()">
            <option [ngValue]="null">Pilih Jenjang</option>
            <option *ngFor="let jen of jenjangList()" [ngValue]="jen.code">{{ jen.name }}</option>
        </select>
    </div>

    <div class="col-12 col-md-6">
        <label class="form-label">Bidang (Opsional)</label>
        <select class="form-select" [ngModel]="selectedBidang()" (ngModelChange)="selectedBidang.set($event); onBidangChange()" [disabled]="!selectedJabatan() || !bidangList().length">
            <option [ngValue]="null">Pilih Bidang</option>
            <option *ngFor="let bid of bidangList()" [ngValue]="bid.code">{{ bid.name }}</option>
        </select>
    </div>

    <div class="col-12 col-md-6">
        <label class="form-label">Kompetensi</label>
        <select class="form-select" [ngModel]="selectedKompetensi()" (ngModelChange)="selectedKompetensi.set($event); onKompetensiChange()" [disabled]="!selectedJenjang()">
            <option [ngValue]="null">Pilih Kompetensi</option>
            <option *ngFor="let comp of kompetensiList()" [ngValue]="comp.id">{{ comp.name }}</option>
        </select>
    </div>

    <div class="col-12">
        <label class="form-label">Indikator</label>
        <div class="d-flex gap-2">
            <div class="flex-grow-1">
                <app-multi-select
                    [options]="indikatorList()"
                    [ngModel]="currentIndikatorSelection()"
                    (selectionChange)="currentIndikatorSelection.set($event)"
                    placeholder="Pilih Indikator (bisa lebih dari satu)"
                    [disabled]="!selectedKompetensi() || !indikatorList().length">
                </app-multi-select>
            </div>
            <button class="btn btn-primary" (click)="addIndikators()" [disabled]="!currentIndikatorSelection().length">
                Tambah
            </button>
        </div>
    </div>
</div>

<div *ngIf="(selectedIndikatorMap() | keyvalue).length > 0" class="mb-4">
    <h5>Indikator Terpilih</h5>
    <ul class="list-group">
        <li class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let item of selectedIndikatorMap() | keyvalue">
            {{ item.value.label }}
            <button class="btn btn-sm btn-outline-danger" (click)="removeIndikator(item.key)">Hapus</button>
        </li>
    </ul>
</div>

<div *ngIf="(selectedIndikatorMap() | keyvalue).length > 0">
    <app-file-handler [inputs]="listUploadInputs()"></app-file-handler>
</div>
