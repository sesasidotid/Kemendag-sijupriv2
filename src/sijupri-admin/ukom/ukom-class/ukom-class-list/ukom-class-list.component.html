<ng-container *ngIf="tab() === 0">
    <div class="d-flex justify-content-end mb-3">
        <button
            (click)="openTimelineModal()"
            class="btn btn-primary"
            type="button"
        >
            <i class="mdi mdi-calendar-range-outline me-1"></i>
            Lihat Timeline Jadwal
        </button>
    </div>

    <app-pagable
        [pagable]="pagable$ | async"
        [refresh]="refreshToggle"
    ></app-pagable>
</ng-container>

<ng-container *ngIf="tab() === 1">
    <app-ukom-class-add
        (changeTabActive)="handleTabChange(0)"
    ></app-ukom-class-add>
</ng-container>

<app-modal
    (toggle)="toggleModal()"
    *ngIf="isModalOpen$ | async"
    [enableFooter]="false"
    [size]="'md'"
    [title]="'Update Kelas'"
>
    <form [formGroup]="editRoomUkomForm" class="">
        <div class="mb-3">
            <label class="form-label fw-bold" for="name"
                >Nama <span class="text-danger">*</span></label
            >
            <input
                appInvalidOnTouch
                class="form-control"
                formControlName="name"
                id="name"
                type="text"
            />
            <div
                *ngIf="getErrorMessage('name', 'Nama') as error"
                class="invalid-feedback"
            >
                {{ error }}
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold" for="jabatan_code"
                >Jabatan <span class="text-danger">*</span></label
            >
            <select
                appInvalidOnTouch
                class="form-select"
                formControlName="jabatan_code"
                id="jabatan_code"
                name="jabatan_code"
            >
                <option hidden selected value="">Pilih Jabatan</option>
                <ng-container
                    *ngIf="(jabatanList$ | async)?.length; else jabatanNotFound"
                >
                    <option
                        *ngFor="let jabatan of jabatanList$ | async"
                        [value]="jabatan.code"
                    >
                        {{ jabatan.name }}
                    </option>
                </ng-container>
                <ng-template #jabatanNotFound>
                    <option disabled>Jabatan tidak ditemukan</option>
                </ng-template>
            </select>
            <div
                *ngIf="getErrorMessage('jabatan_code', 'Jabatan') as error"
                class="invalid-feedback"
            >
                {{ error }}
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold" for="jenjang_code"
                >Jenjang <span class="text-danger">*</span></label
            >
            <select
                appInvalidOnTouch
                class="form-select"
                formControlName="jenjang_code"
                id="jenjang_code"
                name="jenjang_code"
            >
                <option hidden selected value="">Pilih Jenjang</option>
                <ng-container
                    *ngIf="
                        (fixedJenjangList$ | async)?.length;
                        else jabatanNotSelected
                    "
                >
                    <option
                        *ngFor="let jenjang of fixedJenjangList$ | async"
                        [value]="jenjang.code"
                    >
                        {{ jenjang.name }}
                    </option>
                </ng-container>
                <ng-template #jabatanNotSelected>
                    <option disabled>Jenjang tidak ditemukan</option>
                </ng-template>
            </select>
            <div
                *ngIf="getErrorMessage('jenjang_code', 'Jenjang') as error"
                class="invalid-feedback"
            >
                {{ error }}
            </div>
        </div>

        <div *ngIf="(bidangJabatanList$ | async)?.length" class="mb-3">
            <label class="form-label fw-bold" for="bidang_jabatan_code"
                >Bidang Jabatan <span class="text-danger">*</span></label
            >
            <select
                appInvalidOnTouch
                class="form-select"
                formControlName="bidang_jabatan_code"
                id="bidang_jabatan_code"
                name="bidang_jabatan_code"
            >
                <option [ngValue]="null" disabled hidden selected>
                    Pilih Bidang Jabatan
                </option>

                <ng-container
                    *ngIf="
                        (bidangJabatanList$ | async)?.length;
                        else bidangJabatanNotSelected
                    "
                >
                    <option
                        *ngFor="let bidangJabatan of bidangJabatanList$ | async"
                        [value]="bidangJabatan.code"
                    >
                        {{ bidangJabatan.name }}
                    </option>
                </ng-container>
                <ng-template #bidangJabatanNotSelected>
                    <option disabled>Bidang Jabatan tidak ditemukan</option>
                </ng-template>
            </select>

            <div
                *ngIf="
                    getErrorMessage(
                        'bidang_jabatan_code',
                        'Bidang Jabatan'
                    ) as error
                "
                class="invalid-feedback"
            >
                {{ error }}
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold" for="participant_quota"
                >Kuota Peserta <span class="text-danger">*</span></label
            >
            <input
                appInvalidOnTouch
                class="form-control"
                formControlName="participant_quota"
                id="participant_quota"
                type="text"
            />
            <div
                *ngIf="
                    getErrorMessage(
                        'participant_quota',
                        'Kuota peserta'
                    ) as error
                "
                class="invalid-feedback"
            >
                {{ error }}
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold" for="vid_call_link"
                >Link Zoom <span class="text-danger">*</span></label
            >
            <input
                appInvalidOnTouch
                class="form-control"
                formControlName="vid_call_link"
                id="vid_call_link"
                type="text"
            />
            <div
                *ngIf="getErrorMessage('vid_call_link', 'Link Zoom') as error"
                class="invalid-feedback"
            >
                {{ error }}
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold" for="exam_start_at"
                >Waktu Mulai <span class="text-danger">*</span></label
            >
            <input
                appInvalidOnTouch
                class="form-control"
                formControlName="exam_start_at"
                id="exam_start_at"
                type="datetime-local"
            />
            <div
                *ngIf="getErrorMessage('exam_start_at', 'Waktu mulai') as error"
                class="invalid-feedback"
            >
                {{ error }}
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold" for="exam_end_at"
                >Waktu Selesai <span class="text-danger">*</span>
            </label>
            <input
                appInvalidOnTouch
                class="form-control"
                formControlName="exam_end_at"
                id="exam_end_at"
                type="datetime-local"
            />
            <div
                *ngIf="getErrorMessage('exam_end_at', 'Waktu selesai') as error"
                class="invalid-feedback"
            >
                {{ error }}
            </div>
        </div>

        <div class="text-end">
            <app-loading-button
                (clicked)="submit()"
                [className]="'btn btn-primary'"
                [disabled]="editRoomUkomForm.invalid"
                [isLoading]="submitLoading$ | async"
                [label]="'Simpan'"
                [type]="'button'"
            ></app-loading-button>
        </div>
    </form>
</app-modal>

<app-modal
    (toggle)="closeTimelineModal()"
    *ngIf="isTimelineModalOpen()"
    [enableFooter]="false"
    [size]="'xl'"
    [title]="'Timeline Jadwal Ujian'"
>
    <div class="timeline-modal-wrapper">
        <!-- Date Range Form -->
        <div class="date-range-section mb-3">
            <form [formGroup]="dateRangeForm" class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label" for="startDate"
                        >Tanggal Mulai</label
                    >
                    <input
                        class="form-control"
                        formControlName="startDate"
                        id="startDate"
                        type="date"
                    />
                    <div
                        *ngIf="dateRangeForm.get('startDate')?.invalid && dateRangeForm.get('startDate')?.touched"
                        class="text-danger small mt-1"
                    >
                        Tanggal mulai wajib diisi
                    </div>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="endDate"
                        >Tanggal Akhir</label
                    >
                    <input
                        class="form-control"
                        formControlName="endDate"
                        id="endDate"
                        type="date"
                    />
                    <div
                        *ngIf="dateRangeForm.get('endDate')?.invalid && dateRangeForm.get('endDate')?.touched"
                        class="text-danger small mt-1"
                    >
                        Tanggal akhir wajib diisi
                    </div>
                </div>
                <div class="col-md-4">
                    <button
                        (click)="loadSchedules()"
                        [disabled]="isLoadingSchedules() || dateRangeForm.invalid"
                        class="btn btn-primary"
                        type="button"
                    >
                        <span
                            *ngIf="isLoadingSchedules()"
                            aria-hidden="true"
                            class="spinner-border spinner-border-sm me-1"
                            role="status"
                        ></span>
                        <i
                            *ngIf="!isLoadingSchedules()"
                            class="ri-search-line me-1"
                        ></i>
                        {{ isLoadingSchedules() ? 'Memuat...' : 'Tampilkan Data'
                        }}
                    </button>
                </div>
            </form>
        </div>

        <!-- Schedule Display Area -->
        <div *ngIf="!hasLoadedSchedules()" class="text-muted py-5 text-center">
            <i class="ri-calendar-line" style="font-size: 48px"></i>
            <p class="mt-3">
                Silakan pilih rentang tanggal dan klik "Tampilkan Data" untuk
                melihat jadwal ujian
            </p>
        </div>

        <div
            *ngIf="hasLoadedSchedules() && timelineSchedules().length === 0"
            class="text-muted py-5 text-center"
        >
            <i class="ri-calendar-close-line" style="font-size: 48px"></i>
            <p class="mt-3">
                Tidak ada jadwal ujian pada rentang tanggal yang dipilih
            </p>
        </div>

        <div *ngIf="hasLoadedSchedules() && timelineSchedules().length > 0">
            <app-schedule-timeline-modal
                (closeTimeline)="closeTimelineModal()"
                [defaultView]="'table'"
                [schedules]="timelineSchedules()"
            >
            </app-schedule-timeline-modal>
        </div>
    </div>
</app-modal>
