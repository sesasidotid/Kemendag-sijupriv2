<div class="mb-3">
    <form [formGroup]="dateRangeForm" class="row g-3 align-items-end">
        <div class="col-md-3">
            <label class="form-label" for="startDate">Tanggal Mulai</label>
            <input
                class="form-control"
                formControlName="startDate"
                id="startDate"
                type="date"
            />
            <div
                *ngIf="dateRangeForm.get('startDate')?.invalid && dateRangeForm.get('startDate')?.touched"
                class="text-danger small mt-1"
            >
                Tanggal mulai wajib diisi
            </div>
        </div>
        <div class="col-md-3">
            <label class="form-label" for="endDate">Tanggal Akhir</label>
            <input
                class="form-control"
                formControlName="endDate"
                id="endDate"
                type="date"
            />
            <div
                *ngIf="dateRangeForm.get('endDate')?.invalid && dateRangeForm.get('endDate')?.touched"
                class="text-danger small mt-1"
            >
                Tanggal akhir wajib diisi
            </div>
        </div>
        <div class="col-md-3">
            <label class="form-label" for="statusId">Status Penilaian</label>
            <select
                class="form-select"
                formControlName="status"
                id="statusId"
            >
                <option value="all">Semua</option>
                <option value="graded">Sudah Dinilai</option>
                <option value="ungraded">Belum Dinilai</option>
            </select>
            <div
                *ngIf="dateRangeForm.get('status')?.invalid && dateRangeForm.get('status')?.touched"
                class="text-danger small mt-1"
            >
                Status wajib dipilih
            </div>
        </div>
        <div class="col-md-3">
            <button
                (click)="loadSchedules()"
                [disabled]="dateRangeForm.invalid"
                class="btn btn-primary"
                type="button"
            >
                <i class="ri-search-line me-1"></i>
                Tampilkan Data
            </button>
        </div>
    </form>
</div>

<div *ngIf="!hasLoadedSchedules()" class="text-muted py-5 text-center">
    <i class="ri-calendar-line" style="font-size: 48px"></i>
    <p class="mt-3">
        Silakan pilih rentang tanggal dan klik "Tampilkan Data" untuk melihat data penguji
    </p>
</div>

<app-pagable *ngIf="hasLoadedSchedules()" [pagable]="pagable()"></app-pagable>
