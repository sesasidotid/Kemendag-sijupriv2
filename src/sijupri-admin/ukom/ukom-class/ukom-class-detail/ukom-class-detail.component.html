<ng-container *ngIf="(tab$ | async) === 0">
    <ng-container *ngIf="isLoading$ | async; else kelasHadItem">
        <div class="card parent">
            <div class="d-flex justify-content-center my-5">
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>
    </ng-container>

    <ng-template #kelasHadItem>
        <button class="btn btn-sm btn-outline-secondary mb-3" (click)="goBack()">
            <i class="mdi mdi-chevron-left"></i> Kembali
        </button>
        <div>
            <div class="row mb-3">
                <label for="" class="col-sm-2 col-form-label fw-bold">Nama Kelas</label>
                <div class="col-sm-10 pt-2">
                    <p>: {{ detailKelas.name }}</p>
                </div>
            </div>

            <div class="row mb-3">
                <label for="name" class="col-sm-2 col-form-label fw-bold">
                    Tanggal
                </label>
                <div class="col-sm-10 pt-2">
                    <p class="text-transform-none">
                        :
                        {{ detailKelas.examStartAt | tanggalIndo: detailKelas.examEndAt }}
                    </p>
                </div>
            </div>

            <div class="row mb-3">
                <label for="name" class="col-sm-2 col-form-label fw-bold">
                    Jabatan
                </label>
                <div class="col-sm-10 pt-2">
                    <p>
                        :
                        {{ detailKelas.jabatanName }}
                    </p>
                </div>
            </div>

            <div class="row mb-3">
                <label for="name" class="col-sm-2 col-form-label fw-bold">
                    Jenjang
                </label>
                <div class="col-sm-10 pt-2">
                    <p>
                        :
                        {{ detailKelas.jenjangName }}
                    </p>
                </div>
            </div>

            <div class="row mb-3">
                <label for="name" class="col-sm-2 col-form-label fw-bold">
                    Bidang Jabatan
                </label>
                <div class="col-sm-10 pt-2">
                    <p>
                        :
                        {{ detailKelas.bidangJabatanName }}
                    </p>
                </div>
            </div>

            <div class="row mb-3">
                <label for="name" class="col-sm-2 col-form-label fw-bold">
                    Kuota Peserta
                </label>
                <div class="col-sm-10 pt-2">
                    <p>
                        :
                        {{ detailKelas.participantQuota }}
                    </p>
                </div>
            </div>

            <div class="row mb-3">
                <label for="name" class="col-sm-2 col-form-label fw-bold">
                    Link Zoom
                </label>
                <div class="col-sm-10 pt-2">
                    <p class="text-transform-none">
                        :
                        {{ detailKelas.vidCallLink }}
                    </p>
                </div>
            </div>
        </div>

        <section class="mt-5">
            <h5 class="fw-bold">Daftar Peserta</h5>
            <app-pagable [pagable]="pagable"></app-pagable>
        </section>
    </ng-template>
</ng-container>
