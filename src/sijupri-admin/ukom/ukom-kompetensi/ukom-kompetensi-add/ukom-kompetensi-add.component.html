<section>
    <form [formGroup]="kompetensiForm" (ngSubmit)="submit()">
        <div class="row mb-3">
            <label for="name" class="col-sm-2 col-form-label fw-bold"
                >Kode <span class="text-danger">*</span></label
            >
            <div class="col-sm-10">
                <input
                    type="text"
                    id="code"
                    class="form-control"
                    code="code"
                    formControlName="code"
                    placeholder="Masukan nama tempat UKom"
                />
                <div
                    *ngIf="getErrorMessage('code', 'Kode kompetensi') as error"
                    class="text-danger"
                >
                    {{ error }}
                </div>
            </div>
        </div>

        <div class="row mb-3">
            <label for="name" class="col-sm-2 col-form-label fw-bold"
                >Nama Kompetensi <span class="text-danger">*</span></label
            >
            <div class="col-sm-10">
                <input
                    type="text"
                    id="name"
                    class="form-control"
                    name="name"
                    formControlName="name"
                    placeholder="Masukan nama kompetensi"
                />
                <div
                    *ngIf="getErrorMessage('name', 'Nama kompetensi') as error"
                    class="text-danger"
                >
                    {{ error }}
                </div>
            </div>
        </div>

        <div class="row mb-3">
            <label for="level" class="col-sm-2 col-form-label fw-bold"
                >Level <span class="text-danger">*</span></label
            >
            <div class="col-sm-10">
                <input
                    type="text"
                    id="level"
                    class="form-control"
                    name="level"
                    formControlName="level"
                    placeholder="Masukan level kompetensi"
                />
                <div
                    *ngIf="
                        getErrorMessage('level', 'Level kompetensi') as error
                    "
                    class="text-danger"
                >
                    {{ error }}
                </div>
            </div>
        </div>

        <div class="row mb-3">
            <label for="description" class="col-sm-2 col-form-label fw-bold"
                >Deskripsi <span class="text-danger">*</span></label
            >
            <div class="col-sm-10">
                <textarea
                    id="description"
                    class="form-control"
                    name="description"
                    formControlName="description"
                    placeholder="Masukan deskripsi kompetensi"
                    rows="3"
                ></textarea>
                <div
                    *ngIf="
                        getErrorMessage(
                            'description',
                            'Deskripsi kompetensi'
                        ) as error
                    "
                    class="text-danger"
                >
                    {{ error }}
                </div>
            </div>
        </div>

        <div class="row mb-3">
            <label for="jabatan_code" class="col-sm-2 col-form-label fw-bold"
                >Jabatan <span class="text-danger">*</span></label
            >
            <div class="col-sm-10">
                <select
                    id="jabatan_code"
                    class="form-select"
                    name="jabatan_code"
                    formControlName="jabatan_code"
                >
                    <option selected value="" style="display: none">
                        Pilih Jabatan
                    </option>
                    <option
                        *ngFor="let jabatan of jabatanList$ | async"
                        [value]="jabatan.code"
                    >
                        {{ jabatan.name }}
                    </option>
                </select>
                <div
                    *ngIf="getErrorMessage('jabatan_code', 'Jabatan') as error"
                    class="text-danger"
                >
                    {{ error }}
                </div>
            </div>
        </div>

        <div class="row mb-3">
            <label for="jenjang_code" class="col-sm-2 col-form-label fw-bold"
                >Jenjang <span class="text-danger">*</span></label
            >
            <div class="col-sm-10">
                <select
                    id="jenjang_code"
                    class="form-select"
                    name="jenjang_code"
                    formControlName="jenjang_code"
                >
                    <option selected value="" style="display: none">
                        Pilih Jenjang
                    </option>
                    <option
                        *ngFor="let jenjang of jenjangList$ | async"
                        [value]="jenjang.code"
                    >
                        {{ jenjang.name }}
                    </option>
                </select>
                <div
                    *ngIf="getErrorMessage('jenjang_code', 'Jenjang') as error"
                    class="text-danger"
                >
                    {{ error }}
                </div>
            </div>
        </div>

        <div class="row mb-3" *ngIf="(bidangJabatanList$ | async)?.length">
            <label
                for="bidang_jabatan_code"
                class="col-sm-2 col-form-label fw-bold"
                >Bidang Jabatan <span class="text-danger">*</span></label
            >
            <div class="col-sm-10">
                <select
                    id="bidang_jabatan_code"
                    class="form-select"
                    name="bidang_jabatan_code"
                    formControlName="bidang_jabatan_code"
                >
                    <option selected [ngValue]="null" style="display: none">
                        Pilih Bidang Jabatan
                    </option>
                    <option
                        *ngFor="let bidang of bidangJabatanList$ | async"
                        [value]="bidang.code"
                    >
                        {{ bidang.name }}
                    </option>
                </select>
                <div
                    *ngIf="
                        getErrorMessage(
                            'bidang_jabatan_code',
                            'Bidang Jabatan'
                        ) as error
                    "
                    class="text-danger"
                >
                    {{ error }}
                </div>
            </div>
        </div>

        <div class="row text-center">
            <div class="col-12">
                <ng-container *ngIf="submitLoading$ | async; else noLoading">
                    <button class="btn btn-success float-end" disabled>
                        <div
                            class="spinner-border"
                            style="width: 19px; height: 19px"
                            role="status"
                        >
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </button>
                </ng-container>
                <ng-template #noLoading>
                    <button
                        type="submit"
                        class="btn btn-success float-end"
                        [disabled]="
                            kompetensiForm.invalid || (submitLoading$ | async)
                        "
                    >
                        Simpan
                    </button>
                </ng-template>
            </div>
        </div>
    </form>
</section>
