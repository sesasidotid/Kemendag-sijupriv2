<ng-container *ngIf="(currentFlow | async) as cf">
    <ng-container
        *ngIf="(cf === flowId.UkomFlowId3 || cf === flowId.UkomFlowId4 ) && isSuperAdmin"
    >
        <div class="alert alert-warning mb-3 py-2">
            <small>
                Pengajuan yang masih berada pada tab
                <strong>Verifikasi Pengajuan</strong> atau
                <strong>Perbaikan Dokumen</strong>
                akan otomatis masuk ke
                <strong>Lolos Verifikasi</strong>
                saat proses penyelesaian tugas dijalankan.
            </small>
        </div>
        <div class="d-flex justify-content-end mb-3">
            <app-loading-button
                (clicked)="finalizePendingTask()"
                [className]="'btn btn-primary'"
                [icon]="'mdi-check'"
                [isLoading]="finalizeLoading"
                [label]="'Selesaikan Tugas Tertunda'"
            />
        </div>
    </ng-container>
</ng-container>

<app-pagable [pagable]="pagable$ | async" [refresh]="refresh"></app-pagable>
