<section>
  <form [formGroup]="documentForm" (ngSubmit)="submit()">
    <div class="row mb-3">
      <label for="exam_start_at" class="col-sm-2 col-form-label fw-bold"
        >Nama Dokumen <span class="text-danger">*</span></label
      >
      <div class="col-sm-10">
        <input
          type="text"
          id="dokumenPersyaratanName"
          class="form-control"
          name="dokumenPersyaratanName"
          formControlName="dokumenPersyaratanName"
        />
        <div
          class="text-danger"
          *ngIf="
            documentForm.get('dokumenPersyaratanName').invalid &&
            documentForm.get('dokumenPersyaratanName').touched
          "
        >
          <small
            *ngIf="documentForm.get('dokumenPersyaratanName').errors?.['required']"
            >Nama dokumen mulai perlu diisi.</small
          >
        </div>
      </div>
    </div>

    <div class="row mb-3">
      <label for="jenisUkom" class="col-sm-2 col-form-label fw-bold"
        >Jenis Ukom <span class="text-danger">*</span></label
      >
      <div class="col-sm-10">
        <select
          id="jenisUkom"
          class="form-select"
          name="jenisUkom"
          formControlName="jenisUkom"
        >
          <option selected value="" disabled selected style="display: none">
            Pilih Jenis UKom
          </option>
          <option value="KENAIKAN_JENJANG">Kenaikan Jenjang</option>
          <option value="PERPINDAHAN_JABATAN">Perpindahan Jabatan</option>
          <option value="PROMOSI">Promosi</option>
        </select>
        <div
          class="text-danger"
          *ngIf="
            documentForm.get('jenisUkom').invalid &&
            documentForm.get('jenisUkom').touched
          "
        >
          <small *ngIf="documentForm.get('jenisUkom').errors?.['required']"
            >Jenis ukom perlu diisi.</small
          >
        </div>
      </div>
    </div>

    <div class="row mb-3">
      <label for="jabatanCode" class="col-sm-2 col-form-label fw-bold"
        >Jabatan</label
      >
      <div class="col-sm-10">
        <select
          id="jabatanCode"
          class="form-select"
          name="jabatanCode"
          formControlName="jabatanCode"
        >
          <option selected value="" style="display: none">
            Untuk Jabatan ...
          </option>
          <ng-container
            *ngIf="(jabatanList$ | async)?.length; else NextJenjangNotFound"
          >
            <option
              *ngFor="let jabatan of jabatanList$ | async"
              [value]="jabatan.code"
            >
              {{ jabatan.name }}
            </option>
          </ng-container>
          <ng-template #NextJenjangNotFound>
            <option disabled>Jabatan yang dituju tidak ditemukan</option>
          </ng-template>
        </select>
      </div>
    </div>

    <div class="row mb-3">
      <label for="jenjangCode" class="col-sm-2 col-form-label fw-bold"
        >Jenjang</label
      >
      <div class="col-sm-10">
        <select
          id="jenjangCode"
          class="form-select"
          name="jenjangCode"
          formControlName="jenjangCode"
        >
          <option selected value="" style="display: none">
            Untuk Jenjang ...
          </option>
          <ng-container
            *ngIf="(jenjangList$ | async)?.length; else JenjangNotFound"
          >
            <option
              *ngFor="let jenjang of jenjangList$ | async"
              [value]="jenjang.code"
            >
              {{ jenjang.name }}
            </option>
          </ng-container>
          <ng-template #JenjangNotFound>
            <option disabled>Jabatan yang dituju tidak ditemukan</option>
          </ng-template>
        </select>
        <small class="form-text text-muted">
          Isi jika diperlukan. Jika dokumen untuk jenjang tertentu, cukup isi
          jenjang. Jika untuk jabatan tertentu dan jenjang tertentu, isi
          keduanya.
        </small>
      </div>
    </div>

    <div class="row text-center">
      <div class="col-12">
        <ng-container *ngIf="submitLoading$ | async; else noLoading">
          <button class="btn btn-primary float-end" disabled>
            <div
              class="spinner-border"
              style="width: 19px; height: 19px"
              role="status"
            >
              <span class="visually-hidden">Loading...</span>
            </div>
          </button>
        </ng-container>

        <ng-template #noLoading>
          <button
            type="submit"
            class="btn btn-primary float-end"
            [disabled]="documentForm.invalid || (submitLoading$ | async)"
          >
            Simpan
          </button>
        </ng-template>
      </div>
    </div>
  </form>
</section>
