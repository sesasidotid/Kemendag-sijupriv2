<div class="d-flex justify-content-between align-items-center mb-3">
    <!-- Back button -->
    <!--    <button class="btn btn-sm btn-outline-secondary" [routerLink]="['/ukom/ukom-list']">-->
    <!--        <i class=" mdi mdi-chevron-left"></i> Kembali-->
    <!--    </button>-->
    <button (click)="goBack()" class="btn btn-sm btn-outline-secondary">
        <i class="mdi mdi-chevron-left"></i> Kembali
    </button>

    <!-- Open Detail button -->
    <ng-container *ngIf="pesertaUkom?.participantStatus === 'jf'">
        <a
            [href]="'/siap/user-jf/' + pesertaUkom.nip"
            class="btn btn-primary"
            target="_blank"
        >
            <i class="mdi mdi-open-in-new"></i> Lihat Detail
        </a>
    </ng-container>
</div>
<app-ukom-task-detail
    (pesertaUkomChange)="onPesertaUkomReceived($event)"
></app-ukom-task-detail>
