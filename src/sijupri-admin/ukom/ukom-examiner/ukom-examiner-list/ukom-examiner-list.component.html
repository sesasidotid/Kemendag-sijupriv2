<ng-container *ngIf="(tab$ | async) === 0">
    <app-pagable [pagable]="pagable" [refresh]="refreshToggle"></app-pagable>
</ng-container>

<ng-container *ngIf="(tab$ | async) === 1">
    <app-ukom-examiner-add (changeTabActive)="handleTabChange(0)"></app-ukom-examiner-add>
</ng-container>

<app-modal *ngIf="isModalOpen$ | async" [title]="'Update Pengawas'" (toggle)="toggleModal()" [enableFooter]="false">
    <form [formGroup]="editExaminerForm">
        <div class="mb-3">
            <label for="name" class="form-label">Nama <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="name" required formControlName="name" />
            <div class="feedback" *ngIf="
          editExaminerForm.get('name').invalid &&
          editExaminerForm.get('name').touched
        ">
                <small *ngIf="editExaminerForm.get('name').errors?.['required']">Nama tempat UKom perlu diisi.</small>
            </div>
        </div>

        <div class="mb-3">
            <label for="jenis_kelamin_code" class="form-label">Jenis Kelamin <span class="text-danger">*</span></label>
            <select id="jenis_kelamin_code" class="form-select" name="jenis_kelamin_code"
                formControlName="jenis_kelamin_code">
                <option [value]="'F'">Wanita</option>
                <option [value]="'M'">Pria</option>
            </select>
            <div class="feedback" *ngIf="
          editExaminerForm.get('jenis_kelamin_code').invalid &&
          editExaminerForm.get('jenis_kelamin_code').touched
        ">
                <small *ngIf="editExaminerForm.get('jenis_kelamin_code').errors?.['required']">Jenis kelamin perlu
                    diisi.</small>
            </div>
        </div>

        <div class="text-end">
            <app-loading-button [isLoading]="isLoading$ | async" [disabled]="editExaminerForm.invalid"
                [className]="'btn btn-primary'" [label]="'Simpan'" [type]="'button'"
                (clicked)="submit()"></app-loading-button>
        </div>
    </form>
</app-modal>
