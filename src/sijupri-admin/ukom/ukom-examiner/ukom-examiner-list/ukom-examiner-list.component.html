<ng-container *ngIf="(this.tabService.activeTab$ | async) === 0">
    <app-pagable [pagable]="pagable" [refresh]="refreshToggle"></app-pagable>
</ng-container>

<ng-container *ngIf="(this.tabService.activeTab$ | async) === 1">
    <app-ukom-examiner-add
        (changeTabActive)="handleTabChange(0)"
    ></app-ukom-examiner-add>
</ng-container>

<app-modal
    *ngIf="isModalOpen$ | async"
    [title]="'Update Penguji'"
    (toggle)="toggleModal()"
    [enableFooter]="false"
>
    <form [formGroup]="editExaminerForm">
        <div class="mb-3">
            <label for="name" class="form-label"
                >Nama <span class="text-danger">*</span></label
            >
            <input
                type="text"
                class="form-control"
                id="name"
                required
                formControlName="name"
            />
            <div
                *ngIf="getErrorMessage('name','Nama' ) as error"
                class="text-danger"
            >
                {{ error }}
            </div>
        </div>

        <div class="mb-3">
            <label for="jenisKelaminCode" class="form-label"
                >Jenis Kelamin <span class="text-danger">*</span></label
            >
            <select
                id="jenisKelaminCode"
                class="form-select"
                name="jenisKelaminCode"
                formControlName="jenisKelaminCode"
            >
                <option [value]="'F'">Wanita</option>
                <option [value]="'M'">Pria</option>
            </select>
            <div
                *ngIf="getErrorMessage(
                                    'jenisKelaminCode',
                                    'Jenis Kelamin'
                                ) as error
                            "
                class="text-danger"
            >
                {{ error }}
            </div>
        </div>

        <div class="text-end">
            <app-loading-button
                [isLoading]="isLoading$ | async"
                [disabled]="editExaminerForm.invalid"
                [className]="'btn btn-primary'"
                [label]="'Simpan'"
                [type]="'button'"
                (clicked)="submit()"
            ></app-loading-button>
        </div>
    </form>
</app-modal>
