<div class="row">
    <form [formGroup]="addAkpReportForm" (submit)="onSubmit()">
        <div class="row mb-3">
            <label for="inputUnitKerjaId" class="col-sm-2 col-form-label fw-bold">Unit Kerja <span
                    class="text-danger">*</span></label>
            <div class="col-sm-10">
                <select id="inputUnitKerjaId" class="form-select" (change)="onUnitKerjaChange($event)"
                    formControlName="unitKerjaId" name="unitKerjaId">
                    <option selected value="" hidden>Pilih</option>
                    <option *ngFor="let unitKerja of unitKerjaList" [value]="unitKerja.id">
                        {{ unitKerja.name }}
                    </option>
                </select>
                <div *ngIf="getErrorMessage('unitKerjaId', 'Unit Kerja') as error" class="text-danger">
                    {{ error }}
                </div>
            </div>
        </div>

        <div class="row mb-3">
            <label for="inputDate" class="col-sm-2 col-form-label fw-bold">Tanggal <span
                    class="text-danger">*</span></label>
            <div class="col-sm-5">
                <input type="date" name="dateFrom" class="form-control" id="inputDateFrom" formControlName="dateFrom" />
                <div *ngIf="getErrorMessage('dateFrom', 'Tanggal mulai') as error" class="text-danger">
                    {{ error }}
                </div>
            </div>
            <div class="col-sm-5">
                <input type="date" name="dateTo" class="form-control" id="inputDateTo" formControlName="dateTo" />
                <div *ngIf="getErrorMessage('dateTo', 'Tanggal tujuan') as error" class="text-danger">
                    {{ error }}
                </div>
            </div>
        </div>

        <div class="row mb-3">
            <label for="inputfileType" class="col-sm-2 col-form-label fw-bold">Format File <span
                    class="text-danger">*</span></label>
            <div class="col-sm-10">
                <select id="inputfileType" class="form-select" formControlName="fileType" name="fileType">
                    <option [value]="''" selected hidden>Pilih</option>
                    <option [value]="'xlsx'">Excel 2007</option>
                    <option [value]="'xls'">Excel</option>
                    <option [value]="'csv'">CSV</option>
                </select>
                <div *ngIf="getErrorMessage('fileType', 'Format File') as error" class="text-danger">
                    {{ error }}
                </div>
            </div>
        </div>

        <div class="row text-center">
            <div class="col-12">
                <ng-container *ngIf="isLoading$ | async; else noLoading">
                    <button class="btn btn-success float-end" disabled>
                        <div class="spinner-border spinner-sm-custom" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </button>
                </ng-container>
                <ng-template #noLoading>
                    <button type="submit" class="btn btn-success float-end"
                        [disabled]="addAkpReportForm.invalid || (isLoading$ | async)">
                        Generate Report
                    </button>
                </ng-template>

                <!-- <button
          type="submit"
          class="btn btn-success float-end"
          [disabled]="addAkpReportForm.invalid"
        >
          Generate Report
        </button> -->
            </div>
        </div>
    </form>
</div>
<hr />
<div class="row">
    <app-pagable [pagable]="pagable"></app-pagable>
</div>
