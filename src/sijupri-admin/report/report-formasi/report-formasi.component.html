<div class="row">
    <form [formGroup]="addFormasiReportForm" (ngSubmit)="onSubmit()">
        <ng-container *ngIf="exportTypeLoading$ | async">
            <div class="d-flex flex-column justify-content-center align-items-center my-4">
                <div class="spinner-border mb-3" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p>Mendapatkan Data...</p>
            </div>
        </ng-container>
        <ng-container *ngIf="!(exportTypeLoading$ | async)">
            <div class="row mb-3">
                <label for="exportType" class="col-sm-2 col-form-label fw-bold">Tipe Report</label>
                <div class="col-sm-10">
                    <select id="exportType" class="form-select" name="exportType" formControlName="exportType">
                        <option selected value="">Pilih Tipe Report</option>
                        <option [value]="'unitKerja'">Unit Kerja</option>
                        <option [value]="'provinsi'">Provinsi</option>
                        <option [value]="'kabKota'">Kabupaten/Kota</option>
                    </select>
                    <div class="text-muted mt-1">
                        <small> Jangan dipilih jika ingin mengekspor semua data. </small>
                    </div>
                </div>
            </div>

            <div class="row mb-3" *ngIf="addFormasiReportForm.get('exportType').value === 'unitKerja'">
                <label for="inputUnitKerjaId" class="col-sm-2 col-form-label fw-bold">Unit Kerja <span
                        class="text-danger">*</span></label>
                <div class="col-sm-10">
                    <select id="inputUnitKerjaId" class="form-select" formControlName="unitKerjaId" name="unitKerjaId"
                        (change)="patchFormValue($event, 'unitKerja')">
                        <option selected value="" hidden>Pilih Unit Kerja</option>
                        <option *ngFor="let unitKerja of unitKerjaList" [value]="unitKerja.id">
                            {{ unitKerja.name }}
                        </option>
                    </select>
                    <div *ngIf="getErrorMessage('unitKerjaId', 'Unit Kerja') as error" class="text-danger">
                        {{ error }}
                    </div>
                </div>
            </div>

            <div class="row mb-3" *ngIf="addFormasiReportForm.get('exportType').value === 'provinsi'">
                <label for="inputProvinsiId" class="col-sm-2 col-form-label fw-bold">Provinsi <span
                        class="text-danger">*</span></label>
                <div class="col-sm-10">
                    <select id="inputProvinsiId" class="form-select" formControlName="provinsiId" name="provinsiId"
                        (change)="patchFormValue($event, 'provinsi')">
                        <option selected value="" hidden>
                            Pilih Provinsi
                        </option>
                        <option *ngFor="let provinsi of provinsiList" [value]="provinsi.id">
                            {{ provinsi.name }}
                        </option>
                    </select>
                    <div *ngIf="getErrorMessage('provinsiId', 'Provinsi') as error" class="text-danger">
                        {{ error }}
                    </div>
                </div>
            </div>

            <div class="row mb-3" *ngIf="addFormasiReportForm.get('exportType').value === 'kabKota'">
                <label for="inputKabKotaId" class="col-sm-2 col-form-label fw-bold">Kabupaten/Kota <span
                        class="text-danger">*</span></label>
                <div class="col-sm-10">
                    <select id="inputKabKotaId" class="form-select" formControlName="kabKotaId" name="kabKotaId"
                        (change)="patchFormValue($event, 'kabKota')">
                        <option selected value="" hidden>
                            Pilih Kabupaten/Kota
                        </option>
                        <option *ngFor="let kabKota of kabKotaList" [value]="kabKota.id">
                            {{ kabKota.name }}
                        </option>
                    </select>
                    <div *ngIf="getErrorMessage('kabKotaId', 'Kabupaten/Kota') as error" class="text-danger">
                        {{ error }}
                    </div>
                </div>
            </div>

            <div class="row mb-3">
                <label for="inputfileType" class="col-sm-2 col-form-label fw-bold">Format File <span
                        class="text-danger">*</span></label>
                <div class="col-sm-10">
                    <select id="inputfileType" class="form-select" formControlName="fileType" name="fileType">
                        <option selected value="" hidden>
                            Pilih Format File
                        </option>
                        <option [value]="'xlsx'">Excel 2007</option>
                        <option [value]="'xls'">Excel</option>
                        <option [value]="'csv'">CSV</option>
                    </select>
                    <div *ngIf="getErrorMessage('fileType', 'Format file') as error" class="text-danger">
                        {{ error }}
                    </div>
                </div>
            </div>
        </ng-container>

        <div class="row text-center">
            <div class="col-12">
                <ng-container *ngIf="isLoading$ | async; else noLoading">
                    <button class="btn btn-success float-end" disabled>
                        <div class="spinner-border spinner-sm-custom" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </button>
                </ng-container>

                <ng-template #noLoading>
                    <button *ngIf="addFormasiReportForm.get('exportType').value === ''" type="submit"
                        class="btn btn-success float-end" [disabled]="addFormasiReportForm.invalid">
                        Generate Report
                    </button>
                    <button *ngIf="addFormasiReportForm.get('exportType').value === 'unitKerja'" type="submit"
                        class="btn btn-success float-end" [disabled]="
              addFormasiReportForm.invalid ||
              addFormasiReportForm.get('unitKerjaId').value === ''
            ">
                        Generate Report
                    </button>
                    <button *ngIf="addFormasiReportForm.get('exportType').value === 'provinsi'" type="submit"
                        class="btn btn-success float-end" [disabled]="
              addFormasiReportForm.invalid ||
              addFormasiReportForm.get('provinsiId').value === ''
            ">
                        Generate Report
                    </button>
                    <button *ngIf="addFormasiReportForm.get('exportType').value === 'kabKota'" type="submit"
                        class="btn btn-success float-end" [disabled]="
              addFormasiReportForm.invalid ||
              addFormasiReportForm.get('kabKotaId').value === ''
            ">
                        Generate Report
                    </button>
                </ng-template>
            </div>
        </div>
    </form>
</div>
<hr />

<div class="row">
    <app-pagable [pagable]="pagable"></app-pagable>
</div>
