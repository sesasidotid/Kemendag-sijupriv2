<div class="row">
  <div [ngClass]="true ? 'col-lg-8' : 'col-lg-12'">
    <form [formGroup]="updateProvinsiForm" (ngSubmit)="submit()">
      <div class="row mb-3">
        <label for="" class="col-sm-2 col-form-label fw-bold">
          Nama
          <span class="text-danger">*</span>
        </label>
        <div class="col-sm-10">
          <input
            type="text"
            class="form-control"
            name="name"
            id="name"
            formControlName="name"
          />
          <div
            *ngIf="getErrorMessage('name', 'Nama') as error"
            class="text-danger"
          >
            {{ error }}
          </div>
        </div>
      </div>

      <div class="row mb-3">
        <label for="" class="col-sm-2 col-form-label fw-bold">
          Wilayah
          <span class="text-danger">*</span>
        </label>
        <div class="col-sm-10">
          <select
            id="inputState"
            class="form-select"
            name="wilayah_code"
            id="wilayah_code"
            formControlName="wilayah_code"
          >
            <option selected value="" style="display: none">
              Pilih Wilayah
            </option>
            <option *ngFor="let wilayah of wilayahList" [value]="wilayah.code">
              {{ wilayah.name }}
            </option>
          </select>
          <div
            *ngIf="getErrorMessage('wilayah_code', 'Wilayah') as error"
            class="text-danger"
          >
            {{ error }}
          </div>
        </div>
      </div>

      <div class="alert alert-warning" role="alert">
        Pilih titik lokasi pada peta.
      </div>

      <div class="text-center float-end">
        <!-- <button
          type="submit"
          class="btn btn-primary"
          [disabled]="updateProvinsiForm.invalid"
        >
          Simpan
        </button> -->
        <ng-container *ngIf="isLoading$ | async; else noLoading">
          <button class="btn btn-success" disabled>
            <div
              class="spinner-border"
              style="width: 19px; height: 19px"
              role="status"
            >
              <span class="visually-hidden">Loading...</span>
            </div>
          </button>
        </ng-container>
        <ng-template #noLoading>
          <button
            type="submit"
            class="btn btn-success"
            [disabled]="updateProvinsiForm.invalid"
          >
            Simpan
          </button>
        </ng-template>
      </div>
    </form>
  </div>

  <div class="col-lg-4 mt-3 mt-lg-0">
    <app-map
      *ngIf="
        updateProvinsiForm.get('latitude').value &&
        updateProvinsiForm.get('longitude').value
      "
      (coordinates)="onCoordinatesReceived($event)"
      [name]="'indonesia'"
      [type]="'indonesia'"
      [defaultLat]="updateProvinsiForm.get('latitude').value"
      [defaultLng]="updateProvinsiForm.get('longitude').value"
    >
    </app-map>
  </div>
</div>
