<div class="row">
    <div [ngClass]="true ? 'col-lg-8' : 'col-lg-12'">
        <form [formGroup]="addKabKotaForm" (ngSubmit)="submit()">
            <div class="row mb-3">
                <label for="" class="col-sm-2 col-form-label fw-bold">Nama
                    <span class="text-danger">*</span>
                </label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" name="name" id="name" formControlName="name" />
                    <div *ngIf="getErrorMessage('name', 'Nama') as error" class="text-danger">
                        {{ error }}
                    </div>
                </div>
            </div>

            <div class="row mb-3">
                <label for="" class="col-sm-2 col-form-label fw-bold">Tipe
                    <span class="text-danger">*</span>
                </label>
                <div class="col-sm-10">
                    <select id="inputState" class="form-select" name="type" id="type" formControlName="type">
                        <option value="KOTA" selected>Kota</option>
                        <option value="KABUPATEN">Kabupaten</option>
                    </select>
                    <div *ngIf="getErrorMessage('type', 'Tipe') as error" class="text-danger">
                        {{ error }}
                    </div>
                </div>
            </div>

            <div class="row mb-3">
                <label for="" class="col-sm-2 col-form-label fw-bold">Provinsi
                    <span class="text-danger">*</span>
                </label>
                <div class="col-sm-10">
                    <select id="inputState" class="form-select" name="provinsi_id" id="provinsi_id"
                        formControlName="provinsi_id">
                        <option selected value="" hidden>
                            Pilih Wilayah
                        </option>
                        <option *ngFor="let provinsi of provinsiList" [value]="provinsi.id">
                            {{ provinsi.name }}
                        </option>
                    </select>
                    <div *ngIf="getErrorMessage('provinsi_id', 'Provinsi') as error" class="text-danger">
                        {{ error }}
                    </div>
                </div>
            </div>

            <div class="alert alert-warning" role="alert">
                Pilih titik lokasi pada peta.
            </div>
            <div class="text-center float-end">
                <ng-container *ngIf="submitLoading$ | async; else noLoading">
                    <button class="btn btn-success" disabled>
                        <div class="spinner-border spinner-sm-custom" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </button>
                </ng-container>
                <ng-template #noLoading>
                    <button type="submit" class="btn btn-success" [disabled]="addKabKotaForm.invalid">
                        Simpan
                    </button>
                </ng-template>
                <!-- <button
          type="submit"
          class="btn btn-primary"
          [disabled]="addKabKotaForm.invalid"
        >
          Simpan
        </button> -->
            </div>
        </form>
    </div>
    <div class="col-lg-4 mt-3 mt-lg-0">
        <app-map (coordinates)="onCoordinatesReceived($event)" [name]="'indonesia'" [type]="'indonesia'">
        </app-map>
    </div>
</div>
