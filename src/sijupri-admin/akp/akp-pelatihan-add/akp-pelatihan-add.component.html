<form [formGroup]="pelatihanTeknisForm" (ngSubmit)="submit()">
    <div class="row mb-3">
        <label for="code" class="col-sm-2 col-form-label fw-bold">Kode Pelatihan <span
                class="text-danger">*</span></label>
        <div class="col-sm-10">
            <input type="text" id="code" class="form-control" name="code" formControlName="code"
                placeholder="Masukan Kode Pelatihan" />
            <div *ngIf="getErrorMessage('code', 'Kode Pelatihan') as error" class="text-danger">
                {{ error }}
            </div>
        </div>
    </div>
    <div class="row mb-3">
        <label for="name" class="col-sm-2 col-form-label fw-bold">Nama Pelatihan <span
                class="text-danger">*</span></label>
        <div class="col-sm-10">
            <input type="text" id="name" class="form-control" name="name" formControlName="name"
                placeholder="Masukan Nama Pelatihan" />
            <div *ngIf="getErrorMessage('name', 'Nama Pelatihan') as error" class="text-danger">
                {{ error }}
            </div>
        </div>
    </div>
    <div class="row mb-3">
        <label for="jabatanCode" class="col-sm-2 col-form-label fw-bold">
            Jabatan <span class="text-danger">*</span>
        </label>
        <div class="col-sm-10">
            <select class="form-select" name="jabatanCode" id="jabatanCode" formControlName="jabatanCode">
                <option selected value="" hidden>Pilih Jabatan</option>
                <option *ngFor="let jabatan of jabatanList" [value]="jabatan.code">
                    {{ jabatan.name }}
                </option>
            </select>
            <div *ngIf="getErrorMessage('jabatanCode', 'Jabatan') as error" class="text-danger">
                {{ error }}
            </div>
        </div>
    </div>
    <div class="row text-center">
        <div class="col-12">
            <ng-container *ngIf="submitLoading$ | async; else noLoading">
                <button class="btn btn-success float-end" disabled>
                    <div class="spinner-border spinner-sm-custom" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </button>
            </ng-container>
            <ng-template #noLoading>
                <button type="submit" class="btn btn-success float-end"
                    [disabled]="pelatihanTeknisForm.invalid || (submitLoading$ | async)">
                    Simpan
                </button>
            </ng-template>
        </div>
    </div>
</form>
