<app-pagable [pagable]="pagable()" [refresh]="refresh"></app-pagable>

<app-modal
    (toggle)="toggleModal()"
    *ngIf="isModalOpen$ | async"
    [enableFooter]="false"
    [title]="'Update Password'"
>
    <app-force-password-form
        (passwordUpdated)="toggleModal()"
        [userId]="userId"
    />
</app-modal>
