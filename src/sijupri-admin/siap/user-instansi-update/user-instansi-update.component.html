<section>
  <form [formGroup]="updateUserInstasi" (ngSubmit)="submit()">
    <div class="row mb-3">
      <label for="" class="col-sm-2 col-form-label fw-bold"
        >Nama <span class="text-danger">*</span>
      </label>
      <div class="col-sm-10">
        <input
          type="text"
          class="form-control"
          name="name"
          id="name"
          formControlName="name"
        />
        <div
          *ngIf="getErrorMessage('name', 'Nama') as error"
          class="text-danger"
        >
          {{ error }}
        </div>
      </div>
    </div>

    <div class="row mb-3">
      <label for="" class="col-sm-2 col-form-label fw-bold"
        >Email <span class="text-danger">*</span></label
      >
      <div class="col-sm-10">
        <input
          type="email"
          class="form-control"
          name="email"
          id="email"
          formControlName="email"
        />
        <div
          *ngIf="getErrorMessage('email', 'Email') as error"
          class="text-danger"
        >
          {{ error }}
        </div>
      </div>
    </div>

    <div class="row mb-3">
      <label for="" class="col-sm-2 col-form-label fw-bold"
        >Operasional <span class="text-danger">*</span></label
      >
      <div class="col-sm-10">
        <select
          id="inputState"
          class="form-select"
          (change)="onOperasionalChange()"
          formControlName="instansiTypeCode"
          name="instansiTypeCode"
        >
          <option
            *ngFor="let instansiType of instansiTypeList"
            [value]="instansiType.code"
          >
            {{ instansiType.name }}
          </option>
        </select>
        <div
          *ngIf="getErrorMessage('instansiTypeCode', 'Operasional') as error"
          class="text-danger"
        >
          {{ error }}
        </div>
      </div>
    </div>

    <div
      *ngIf="
        ['IT3', 'IT4', 'IT5'].includes(
          this.updateUserInstasi.get('instansiTypeCode').value
        )
      "
      (change)="onProvinsiChange()"
      class="row mb-3"
    >
      <label for="" class="col-sm-2 col-form-label fw-bold"
        >Provinsi <span class="text-danger">*</span></label
      >
      <div class="col-sm-10">
        <select
          id="inputState"
          class="form-select"
          name="provinsiId"
          formControlName="provinsiId"
        >
          <option *ngFor="let provinsi of provinsiList" [value]="provinsi.id">
            {{ provinsi.name }}
          </option>
        </select>
        <div
          *ngIf="getErrorMessage('provinsiId', 'Provinsi') as error"
          class="text-danger small"
        >
          {{ error }}
        </div>
      </div>
    </div>

    <div
      *ngIf="
        this.updateUserInstasi.get('instansiTypeCode').value == 'IT4' &&
        this.updateUserInstasi.get('provinsiId').value !== null
      "
      (change)="onKabKotaChange()"
      class="row mb-3"
    >
      <label for="" class="col-sm-2 col-form-label fw-bold"
        >Kabupaten <span class="text-danger">*</span></label
      >
      <div class="col-sm-10">
        <select
          id="inputState"
          class="form-select"
          name="kabupatenId"
          formControlName="kabupatenId"
        >
          <option *ngFor="let kabupaten of kabKotaList" [value]="kabupaten.id">
            {{ kabupaten.name }}
          </option>
        </select>
        <div
          *ngIf="getErrorMessage('kabupatenId', 'Kabupaten') as error"
          class="text-danger small"
        >
          {{ error }}
        </div>
      </div>
    </div>

    <div
      *ngIf="
        this.updateUserInstasi.get('instansiTypeCode').value == 'IT5' &&
        this.updateUserInstasi.get('provinsiId').value !== null
      "
      (change)="onKabKotaChange()"
      class="row mb-3"
    >
      <label for="" class="col-sm-2 col-form-label fw-bold"
        >Kota <span class="text-danger">*</span></label
      >
      <div class="col-sm-10">
        <select
          id="inputState"
          class="form-select"
          formControlName="kotaId"
          name="kotaId"
        >
          <option *ngFor="let kota of kabKotaList" [value]="kota.id">
            {{ kota.name }}
          </option>
        </select>
        <div
          *ngIf="getErrorMessage('kotaId', 'Kota') as error"
          class="text-danger small"
        >
          {{ error }}
        </div>
      </div>
    </div>

    <div
      *ngIf="
        (this.updateUserInstasi.get('instansiTypeCode').value &&
          ['IT1', 'IT2'].includes(
            this.updateUserInstasi.get('instansiTypeCode').value
          )) ||
        (['IT3'].includes(
          this.updateUserInstasi.get('instansiTypeCode').value
        ) &&
          this.updateUserInstasi.get('provinsiId').value) ||
        (['IT4', 'IT5'].includes(
          this.updateUserInstasi.get('instansiTypeCode').value
        ) &&
          this.updateUserInstasi.get('instansiTypeCode').value &&
          (this.updateUserInstasi.get('kabupatenId').value ||
            this.updateUserInstasi.get('kotaId').value))
      "
      class="row mb-3"
    >
      <label for="" class="col-sm-2 col-form-label fw-bold"
        >Instansi <span class="text-danger">*</span></label
      >
      <div class="col-sm-10">
        <select
          id="inputState"
          class="form-select"
          formControlName="instansi_id"
        >
          <option *ngFor="let instansi of instansiList" [value]="instansi.id">
            {{ instansi.name }}
          </option>
        </select>
        <div
          *ngIf="getErrorMessage('instansi_id', 'Instansi') as error"
          class="text-danger small"
        >
          {{ error }}
        </div>
      </div>
    </div>

    <div class="row text-center">
      <div class="col-12">
        <ng-container *ngIf="isLoading$ | async; else noLoading">
          <button class="btn btn-success float-end" disabled>
            <div
              class="spinner-border"
              style="width: 19px; height: 19px"
              role="status"
            >
              <span class="visually-hidden">Loading...</span>
            </div>
          </button>
        </ng-container>
        <ng-template #noLoading>
          <button
            type="submit"
            class="btn btn-success float-end"
            [disabled]="updateUserInstasi.invalid || (isLoading$ | async)"
          >
            Simpan
          </button>
        </ng-template>
      </div>
    </div>
  </form>
</section>
