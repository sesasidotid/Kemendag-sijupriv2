@if (pagable()){
<!--<app-pagable [pagable]="pagable()"></app-pagable>-->
<section>
    <div class="card-header align-items-center d-flex">
        <h4 class="card-title flex-grow-1 mb-0">Riwayat UKom</h4>
    </div>

    <div class="card-body">
        <app-pagable [pagable]="pagable()"></app-pagable>
    </div>
</section>
} @if (rejectedPagable()){
<section>
    <div class="card-header align-items-center d-flex">
        <h4 class="card-title flex-grow-1 mb-0">Riwayat UKom yang Ditolak</h4>
    </div>

    <div class="card-body">
        <app-pagable [pagable]="rejectedPagable()"></app-pagable>
    </div>
</section>
}
