<app-pagable [pagable]="pagable" [refresh]="refresh"></app-pagable>

<app-modal *ngIf="isModalOpen$ | async" [title]="'Update User Instansi'" (toggle)="toggleModal()"
    [enableFooter]="false">
    <app-user-instansi-update [userInstansi]="selectedUserInstansi"
        (refreshList)="toggleRefresh()"></app-user-instansi-update>
</app-modal>

<app-modal *ngIf="isModalPasswordOpen$ | async" [title]="'Update Password '" (toggle)="togglePasswordModal()"
    [enableFooter]="false">
    <app-force-password-form [userId]="userId" (passwordUpdated)="togglePasswordModal()" />
</app-modal>
