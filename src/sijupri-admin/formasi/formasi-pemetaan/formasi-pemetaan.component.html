<section>
  <div class="dropdown search-dropdown-container position-relative mb-3">
    <input
      type="text"
      class="form-control search-input"
      [formControl]="searchControl"
      placeholder="Silakan ketik Nama Unit Kerja dengan ejaan yang benar (huruf kapital berpengaruh)"
      (focus)="onFocusInput()"
      (blur)="onBlurInput()"
    />
    <i class="mdi mdi-magnify search-icon"></i>
    <ul *ngIf="showDropdown$ | async" class="dropdown-menu show w-100">
      <ng-container *ngIf="results.length; else noResults">
        <li
          *ngFor="let result of results"
          class="dropdown-item"
          (click)="selectItem(result)"
        >
          {{ result.unitKerjaName }}
        </li>
      </ng-container>
      <ng-template #noResults>
        <li class="dropdown-item text-muted text-center">
          Unit Kerja Tidak Ditemukan
        </li>
      </ng-template>
    </ul>
  </div>

  <button class="btn btn-soft-primary mb-3" (click)="resetMap()">
    Reset Map
  </button>

  <div id="map"></div>
</section>

<div class="mt-3">
  <p class="h3" *ngIf="availableFormation.length > 0">
    Formasi Tersedia Untuk {{ untuK }}
  </p>
  <table class="table table-bordered">
    <thead class="table-primary">
      <tr>
        <th scope="col" class="align-middle">No</th>
        <th scope="col" class="align-middle">Jabatan</th>
        <th scope="col" class="align-middle">Jenjang Jabatan</th>
        <th scope="col" class="align-middle">Jumlah Formasi</th>
      </tr>
    </thead>
    <tbody>
      <ng-container *ngFor="let item of availableFormation; let i = index">
        <tr
          *ngFor="let formasi of item.jenjangSumList; let j = index"
          (mouseover)="hoverJabatan(i, true)"
          (mouseleave)="hoverJabatan(i, false)"
          [class.highlight]="hoveredJabatanIndex === i"
        >
          <td
            *ngIf="j === 0"
            class="align-middle"
            [attr.rowspan]="item.jenjangSumList.length"
            [class.highlight]="hoveredJabatanIndex === i"
          >
            {{ i + 1 }}
          </td>
          <td
            *ngIf="j === 0"
            class="align-middle"
            [attr.rowspan]="item.jenjangSumList.length"
            [class.highlight]="hoveredJabatanIndex === i"
          >
            {{ item.jabatanName }}
          </td>
          <td class="align-middle">{{ formasi.jenjangName }}</td>
          <td class="align-middle">
            {{ formasi.resultSum || 0 }}
          </td>
        </tr>
      </ng-container>

      <tr>
        <td colspan="3" class="align-middle text-center fw-bold">
          Jumlah Formasi yang Tersedia
        </td>
        <td class="align-middle fw-bold">
          {{ getTotalRekapitulasi() }}
        </td>
      </tr>
    </tbody>
  </table>
</div>
