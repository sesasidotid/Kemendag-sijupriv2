<form>
    <div class="col-lg-12 mb-3">
        <div class="alert alert-primary" role="alert">
            {{ question.question }}
        </div>
    </div>

    <div class="col-lg-12">
        <div class="row">
            <app-file-handler [inputs]="inputs"></app-file-handler>
        </div>
    </div>
    <div class="row text-center">
        <div class="col-12">
            <ng-container *ngIf="isSubmitLoading$ | async; else noLoading">
                <button class="btn btn-success float-end" disabled>
                    <div
                        class="spinner-border"
                        style="width: 19px; height: 19px"
                        role="status"
                    >
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </button>
            </ng-container>
            <ng-template #noLoading>
                <button
                    type="button"
                    class="btn btn-success float-end"
                    (click)="onSubmit()"
                    [disabled]="
                        makalah_form.invalid || (isSubmitLoading$ | async)
                    "
                >
                    Simpan
                </button>
            </ng-template>
        </div>
    </div>
</form>
