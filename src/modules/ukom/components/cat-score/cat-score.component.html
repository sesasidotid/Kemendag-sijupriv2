<div class="total-score-container">
    <div class="total-score-value">{{ score?.score | truncateDecimal:2 }}</div>
</div>

<div *ngFor="let competencyGroup of getGroupedCompetencies()" class="mb-3">
    <div class="card mb-3 border-0">
        <div class="card-header bg-primary text-white">
            <div class="d-flex justify-content-between align-items-center">
                <h4 class="mb-0 text-white">{{ competencyGroup.name }}</h4>
                <span class="badge badge-light badge-lg">
                    {{ competencyGroup.percentage }}% ({{
                    competencyGroup.correct }}/{{ competencyGroup.total }})
                </span>
            </div>
        </div>
    </div>
</div>
