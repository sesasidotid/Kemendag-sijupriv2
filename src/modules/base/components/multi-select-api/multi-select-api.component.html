<div class="multi-select-container">
    <!-- Main Select Box -->
    <div
        #selectInput
        class="multi-select-input form-control"
        [class.disabled]="disabled"
        [class.open]="isDropdownOpen"
        (click)="toggleDropdown()"
    >
        <!-- Selected Items Display -->
        <div class="selected-items" *ngIf="selectedIds.length > 0">
            <span
                *ngFor="let option of getSelectedOptions()"
                class="badge bg-primary mb-1 me-1"
            >
                {{ option.label }}
                <button
                    type="button"
                    class="btn-remove"
                    (click)="removeOption(option.id, $event)"
                    [disabled]="disabled"
                >
                    <lucide-angular [img]="X" [size]="14"></lucide-angular>
                </button>
            </span>
        </div>

        <!-- Placeholder -->
        <span class="placeholder-text" *ngIf="selectedIds.length === 0">
            {{ placeholder }}
        </span>

        <!-- Dropdown Arrow -->
        <div class="dropdown-arrow">
            <button
                type="button"
                class="btn-clear me-1"
                *ngIf="selectedIds.length > 0 && !disabled"
                (click)="clearAll($event)"
                title="Clear all"
            >
                <lucide-angular [img]="X" [size]="16"></lucide-angular>
            </button>
            <lucide-angular
                [img]="ChevronDown"
                [size]="20"
                [class.rotated]="isDropdownOpen"
            ></lucide-angular>
        </div>
    </div>

    <!-- Dropdown Menu -->
    <div
        class="dropdown-menu"
        *ngIf="isDropdownOpen"
        [style.max-height]="maxHeight"
        [style.top]="dropdownPosition.top"
        [style.left]="dropdownPosition.left"
        [style.width]="dropdownPosition.width"
    >
        <!-- Search Input -->
        <div class="search-container">
            <div class="input-group input-group-sm">
                <span class="input-group-text">
                    <lucide-angular [img]="Search" [size]="16"></lucide-angular>
                </span>
                <input
                    type="text"
                    class="form-control"
                    [placeholder]="searchPlaceholder"
                    [(ngModel)]="searchTerm"
                    (input)="onSearchChange($event)"
                    (click)="$event.stopPropagation()"
                />
            </div>
        </div>

        <!-- Options List -->
        <div #optionsList class="options-list" (scroll)="onScroll($event)">
            <div *ngIf="!isLoading && options.length === 0" class="empty-state">
                {{ searchTerm ? noResultsMessage : emptyMessage }}
            </div>

            <div
                *ngFor="let option of options"
                class="option-item"
                [class.selected]="isSelected(option.id)"
                (click)="toggleOption(option)"
            >
                <input
                    type="checkbox"
                    class="form-check-input me-2"
                    [checked]="isSelected(option.id)"
                    (click)="$event.stopPropagation()"
                />
                <span>{{ option.label }}</span>
            </div>

            <!-- Loading Indicator -->
            <div *ngIf="isLoading" class="loading-state">
                <div
                    class="spinner-border spinner-border-sm text-primary"
                    role="status"
                >
                    <span class="visually-hidden">Loading...</span>
                </div>
                <span class="ms-2">Loading...</span>
            </div>

            <!-- Load More Button -->
            <div
                *ngIf="!isLoading && hasMoreData && options.length > 0"
                class="load-more-container"
            >
                <button
                    type="button"
                    class="btn btn-sm btn-outline-primary w-100"
                    (click)="loadMore()"
                >
                    Load More
                </button>
            </div>

            <!-- End of Results -->
            <div
                *ngIf="!isLoading && !hasMoreData && options.length > 0"
                class="end-state"
            >
                End of results
            </div>
        </div>
    </div>
</div>
