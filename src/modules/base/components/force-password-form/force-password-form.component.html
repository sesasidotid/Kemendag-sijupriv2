<form (ngSubmit)="submitForm()" [formGroup]="form">
    <div class="mb-3">
        <label class="form-label"
            >Password Baru <span class="text-danger">*</span></label
        >
        <input
            appInvalidOnTouch
            class="form-control"
            formControlName="password"
            type="password"
        />
        <div
            *ngIf="getErrorMessage('password', 'Password') as error"
            class="invalid-feedback"
        >
            {{ error }}
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label"
            >Konfirmasi Password Baru <span class="text-danger">*</span></label
        >
        <input
            appInvalidOnTouch
            class="form-control"
            formControlName="confirmPassword"
            type="password"
        />
        <div
            *ngIf="getErrorMessage('confirmPassword', 'Konfirmasi Password') as error"
            class="invalid-feedback"
        >
            {{ error }}
        </div>
    </div>

    <div class="d-flex justify-content-end mt-3">
        <button
            (click)="cancel()"
            *ngIf="showCancelButton"
            [disabled]="(isLoading$ | async)"
            class="btn btn-secondary me-2"
            type="button"
        >
            Cancel
        </button>
        <button
            (click)="submitForm()"
            [disabled]="form.invalid || (isLoading$ | async)"
            class="btn btn-primary"
            type="submit"
        >
            <span *ngIf="!(isLoading$ | async)">Update</span>
            <span
                *ngIf="(isLoading$ | async)"
                class="spinner-border spinner-border-sm"
            ></span>
        </button>
    </div>
</form>
