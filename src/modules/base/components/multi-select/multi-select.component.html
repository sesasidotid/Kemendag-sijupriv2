<div class="multi-select-container">
    <!-- Main Select Box -->
    <div
        class="multi-select-input form-control"
        [class.disabled]="disabled"
        [class.open]="isDropdownOpen"
        (click)="toggleDropdown()"
    >
        <!-- Selected Items Display -->
        <div class="selected-items" *ngIf="selectedIds.length > 0">
            <span
                *ngFor="let option of getSelectedOptions()"
                class="badge bg-primary mb-1 me-1"
            >
                {{ option.label }}
                <button
                    type="button"
                    class="btn-remove"
                    (click)="removeOption(option.id, $event)"
                    [disabled]="disabled"
                >
                    <lucide-angular [img]="X" [size]="14"></lucide-angular>
                </button>
            </span>
        </div>

        <!-- Placeholder -->
        <span class="placeholder-text" *ngIf="selectedIds.length === 0">
            {{ placeholder }}
        </span>

        <!-- Dropdown Arrow -->
        <div class="dropdown-arrow">
            <button
                type="button"
                class="btn-clear me-1"
                *ngIf="selectedIds.length > 0 && !disabled"
                (click)="clearAll($event)"
                title="Clear all"
            >
                <lucide-angular [img]="X" [size]="16"></lucide-angular>
            </button>
            <lucide-angular
                [img]="ChevronDown"
                [size]="20"
                [class.rotated]="isDropdownOpen"
            ></lucide-angular>
        </div>
    </div>

    <!-- Dropdown Menu -->
    <div
        class="dropdown-menu"
        *ngIf="isDropdownOpen"
        [style.max-height]="maxHeight"
    >
        <!-- Search Input -->
        <div class="search-container">
            <div class="input-group input-group-sm">
                <span class="input-group-text">
                    <lucide-angular [img]="Search" [size]="16"></lucide-angular>
                </span>
                <input
                    type="text"
                    class="form-control"
                    [placeholder]="searchPlaceholder"
                    [(ngModel)]="searchTerm"
                    (input)="onSearchChange($event)"
                    (click)="$event.stopPropagation()"
                />
            </div>
        </div>

        <!-- Options List -->
        <div class="options-list">
            <div
                *ngIf="filteredOptions.length === 0 && options.length === 0"
                class="empty-state"
            >
                {{ emptyMessage }}
            </div>

            <div
                *ngIf="filteredOptions.length === 0 && options.length > 0"
                class="empty-state"
            >
                {{ noResultsMessage }}
            </div>

            <div
                *ngFor="let option of filteredOptions"
                class="option-item"
                [class.selected]="isSelected(option.id)"
                (click)="toggleOption(option.id)"
            >
                <input
                    type="checkbox"
                    class="form-check-input me-2"
                    [checked]="isSelected(option.id)"
                    (click)="$event.stopPropagation()"
                />
                <span>{{ option.label }}</span>
            </div>
        </div>
    </div>
</div>
