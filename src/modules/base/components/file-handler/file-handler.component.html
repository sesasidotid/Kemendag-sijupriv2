<!-- file-handler.component.html -->
<div class="file-parent">
    <div *ngIf="!inputs.viewOnly">
        <div class="mb-3">
            <label class="form-label" for="emailInput">
                File:
                <!--                <span class="text-danger">*</span>-->
            </label>
            <small
                *ngIf="inputs.allowedTypes?.length || inputs.maxSize"
                class="text-muted d-block"
            >
                <span *ngIf="inputs.allowedTypes?.length">
                    Jenis file yang diperbolehkan: {{ getAllowedTypes() }}
                    <br />
                </span>

                <span *ngIf="inputs.maxSize">
                    Ukuran maksimum: {{ inputs.maxSize / (1024 * 1024) }} MB
                </span>
            </small>
        </div>
    </div>
    <!-- <ng-container *ngFor="let obj of inputs.files | keyvalue"> -->
    <ng-container *ngFor="let obj of inputs.files | keyvalue: sortByLabel">
        <div
            *ngIf="
                obj.value.visible == null ||
                obj.value.visible == undefined ||
                obj.value.visible()
            "
            class="d-flex flex-column mb-3 gap-2"
        >
            <label class="form-label">
                {{ obj.value.label }}
                <span *ngIf="obj.value.required" class="text-danger">*</span>
            </label>
            <div
                *ngIf="hadItemsLoading$ | async; else loadCompleted"
                class="spinner-border"
                role="status"
            >
                <span class="visually-hidden">Loading...</span>
            </div>
            <ng-template #loadCompleted>
                <div
                    #container
                    [class.justify-content-between]="isSmallScreen"
                    class="d-flex align-items-center w-100 gap-3"
                >
                    <div class="d-flex align-items-center overflow-hidden">
                        <div *ngIf="!inputs.viewOnly">
                            <div class="custom-file-upload">
                                <input
                                    (change)="handleFileUpload($event, obj.key)"
                                    [id]="'fileInput' + obj.key"
                                    class="hidden-input"
                                    type="file"
                                />
                                <label
                                    [for]="'fileInput' + obj.key"
                                    class="custom-file-label"
                                >
                                    <span class="file-icon"></span>
                                    <span class="file-text">Pilih File</span>
                                </label>
                            </div>
                        </div>
                        <div
                            *ngIf="fileNames[obj.key]"
                            [title]="fileNames[obj.key]"
                            class="file-name text-truncate"
                        >
                            {{ fileNames[obj.key] }}
                        </div>
                    </div>

                    <ng-container *ngIf="obj.value.source">
                        <a
                            (click)="
                                previewFile(obj.value.label, obj.value.source)
                            "
                            class="btn btn-soft-success d-flex align-items-center justify-content-center flex-shrink-0 text-center"
                        >
                            Preview
                        </a>
                    </ng-container>
                </div>

                <ng-container *ngIf="obj.value.remark">
                    <div class="alert alert-warning mt-1">
                        <strong>Catatan Revisi : </strong>
                        {{ obj.value.remark }}
                    </div>
                </ng-container>
            </ng-template>
        </div>
    </ng-container>
</div>
