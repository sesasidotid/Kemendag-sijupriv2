    <!-- Export Button -->
    <div
        class="toolbar-section d-flex justify-content-between align-items-center"
    >
        <div class="legend">
            <span class="legend-label me-2">Keterangan Jabatan:</span>

            <span
                *ngFor="let role of colorPalette | keyvalue"
                class="legend-item"
            >
                <ng-container *ngIf="role.key !== 'DEFAULT'">
                    <span
                        [style.backgroundColor]="role.value"
                        class="legend-color"
                    >
                    </span>
                    {{ role.key }}
                </ng-container>
            </span>
        </div>

        <!--        <button (click)="exportToCsv()" class="btn btn-success">-->
        <!--            <i class="ri-file-excel-2-line me-1"></i>-->
        <!--            Export CSV-->
        <!--        </button>-->
    </div>

    <!-- AG Grid Table -->
    <div
        *ngIf="(processedRows$ | async)?.length; else emptyState"
        class="grid-section"
    >
        <ag-grid-angular
            (gridReady)="onGridReady($event)"
            [animateRows]="true"
            [columnDefs]="columnDefs"
            [defaultColDef]="defaultColDef"
            [paginationPageSizeSelector]="[10, 25, 50, 100]"
            [paginationPageSize]="25"
            [pagination]="true"
            [rowData]="processedRows$ | async"
            [suppressCellFocus]="true"
            class="ag-theme-alpine"
            style="height: 500px; width: 100%"
        >
        </ag-grid-angular>
    </div>

    <!-- Empty State -->
    <ng-template #emptyState>
        <div class="empty-state py-5 text-center">
            <i class="ri-calendar-line empty-icon"></i>
            <p class="text-muted mt-3">Tidak ada jadwal untuk ditampilkan</p>
        </div>
    </ng-template>

    <!-- Conflict Info -->
    <div
        *ngIf="(summary$ | async)?.totalLanes as lanes"
        class="alert alert-info small mt-3"
    >
        <i class="ri-information-line me-2"></i>
        <strong>Lane</strong> menunjukkan jalur paralel yang dibutuhkan.
        <span *ngIf="lanes > 1">
            Terdapat <strong>{{ lanes }}</strong> lane, artinya terdapat hingga
            {{ lanes }} jadwal yang berjalan bersamaan.
        </span>
        <span *ngIf="lanes === 1">
            Semua jadwal berjalan secara berurutan tanpa tumpang tindih.
        </span>
    </div>
</div>
