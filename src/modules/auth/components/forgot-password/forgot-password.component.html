<main>
    <div class="container">
        <section class="section register min-vh-100 d-flex flex-column align-items-center justify-content-center py-4">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-6 col-md-6 d-flex flex-column align-items-center justify-content-center">
                        <div class="card mb-3">
                            <div class="card-body py-4">
                                <div class="rounded-circle mx-auto mb-3 w-fit border p-3">
                                    <img src="assets/logo/kemendag-logo.svg" alt="" width="32" />
                                </div>
                                <div class="pb-2">
                                    <h5 class="card-title fs-3 pb-0 text-center">
                                        Lupa Password
                                    </h5>
                                    <p class="small text-subtitle mt-2 text-center">
                                        Masukkan NIP anda untuk mereset
                                        password.
                                    </p>
                                </div>

                                <div *ngIf="submitMessage">
                                    <div *ngIf="submitMessage.status !== ''" class="alert" [ngClass]="
        submitMessage.status === 'error' ? 'alert-danger' : 'alert-success'
      " role="alert">
                                        {{ submitMessage.message }}
                                    </div>
                                </div>

                                <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()"
                                    class="row g-3 needs-validation">
                                    <div class="col-12">
                                        <label for="userId" class="form-label">NIP
                                            <span class="text-danger">*</span></label>
                                        <input type="text" name="userId" class="form-control" id="userId"
                                            formControlName="userId" />
                                        <div *ngIf="
                                getErrorMessage(
                                    'userId',
                                    'NIP'
                                ) as error
                            " class="text-danger">
                                            {{ error }}
                                        </div>
                                    </div>

                                    <div class="col-12 mt-3">
                                        <app-loading-button [isLoading]="isSubmitLoading"
                                            [disabled]="forgotPasswordForm.invalid" [type]="'submit'" label="Kirim"
                                            [className]="'btn grad-button w-100'"></app-loading-button>

                                        <a class="btn grad-button-secondary w-100 mt-2" [routerLink]="['/login']">
                                            Kembali ke Login
                                        </a>
                                    </div>
                                </form>
                            </div>
                        </div>
                        <small class="text-muted text-center">Copyright &copy; Kementerian Perdagangan Republik
                            Indonesia</small>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main>
