<main>
    <div class="container">
        <section class="section register min-vh-100 d-flex flex-column align-items-center justify-content-center py-4">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-6 col-md-6 d-flex flex-column align-items-center justify-content-center">
                        <div class="card mb-3">
                            <div class="card-body py-4">
                                <div class="rounded-circle mx-auto mb-3 w-fit border p-3">
                                    <img src="assets/logo/kemendag-logo.svg" alt="" width="32" />
                                </div>

                                <div class="pb-2">
                                    <h5 class="card-title fs-3 pb-0 text-center">
                                        Masuk ke akun anda
                                    </h5>
                                    <p class="small text-subtitle mt-2 text-center">
                                        Silahkan isi data dibawah untuk masuk
                                    </p>
                                </div>

                                <div *ngIf="loginMessage()">
                                    <div *ngIf="loginMessage().status !== ''" class="alert" [ngClass]="
                        loginMessage().status === 'error'
                          ? 'alert-danger'
                          : 'alert-success'
                      " role="alert">
                                        {{ loginMessage().message }}
                                    </div>
                                </div>

                                <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="row g-3 needs-validation">
                                    <div class="col-12">
                                        <label for="nip" class="form-label">NIP
                                            <span class="text-danger">*</span></label>
                                        <div class="input-group has-validation">
                                            <input type="text" name="nip" class="form-control" id="nip"
                                                formControlName="nip" />
                                        </div>
                                        <div *ngIf="
                                getErrorMessage(
                                    'nip',
                                    'NIP'
                                ) as error
                            " class="text-danger">
                                            {{ error }}
                                        </div>
                                    </div>

                                    <div class="col-12">
                                        <label for="password" class="form-label">Kata Sandi
                                            <span class="text-danger">*</span></label>
                                        <div class="input-group has-validation">
                                            <input [type]="isPasswordVisible ? 'text' : 'password'" name="password"
                                                class="form-control" id="password" formControlName="password" />
                                            <span class="input-group-text cursor-pointer"
                                                (click)="togglePasswordVisibility()"><i-lucide
                                                    [img]="isPasswordVisible ? Eye : EyeOff" [size]="16"
                                                    class="my-icon"></i-lucide></span>
                                        </div>
                                        <div *ngIf="
                                getErrorMessage(
                                    'password',
                                    'Password'
                                ) as error
                            " class="text-danger">
                                            {{ error }}
                                        </div>
                                    </div>

                                    <div class="col-12">
                                        <div class="recaptcha-container">
                                            <re-captcha [siteKey]="recaptchaSiteKey" formControlName="recaptcha"
                                                [size]="'normal'"></re-captcha>
                                        </div>
                                        <div *ngIf="
                                getErrorMessage(
                                    'recaptcha',
                                    'reCAPTCHA'
                                ) as error
                            " class="text-danger">
                                            {{ error }}
                                        </div>
                                    </div>

                                    <div class="col-12">
                                        <app-loading-button [disabled]="loginForm.invalid"
                                            [isLoading]="isLoginLoading()" [label]="'Masuk Sekarang'"
                                            [className]="'btn grad-button w-100'"
                                            [type]="'submit'"></app-loading-button>

                                        <a class="btn grad-button-secondary w-100 mt-1" [routerLink]="['']">
                                            Kembali
                                        </a>
                                    </div>

                                    <a [routerLink]="['/login-cat']" class="btn btn-link text-primary">Masuk halaman
                                        UKom</a>

                                    <a [routerLink]="['/forget-password']"
                                        class="btn btn-sm btn-link text-primary m-0">Lupa Password?</a>
                                </form>
                            </div>
                        </div>
                        <small class="text-muted text-center">Copyright &copy; Kementerian Perdagangan Republik
                            Indonesia</small>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main>
