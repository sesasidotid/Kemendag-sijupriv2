<main>
  <section
    class="section register min-vh-100 d-flex flex-column align-items-center justify-content-center py-4"
  >
    <div class="container">
      <div class="row justify-content-center">
        <div
          class="col-lg-6 col-md-6 d-flex flex-column align-items-center justify-content-center"
        >
          <div class="card mb-3">
            <div class="card-body py-4">
              <div class="p-3 border rounded-circle w-fit mx-auto mb-3">
                <img src="assets/logo/kemendag-logo.svg" alt="" width="32" />
              </div>
              <div class="pb-2">
                <h5 class="card-title text-center pb-0 fs-3">Reset Password</h5>
                <p class="text-center small text-subtitle mt-2">
                  Silahkan Masukkan Password Baru.
                </p>
              </div>

              <div *ngIf="submitMessage$ | async as submitMessage">
                <div
                  *ngIf="submitMessage.status !== ''"
                  class="alert"
                  [ngClass]="
                    submitMessage.status === 'error'
                      ? 'alert-danger'
                      : 'alert-success'
                  "
                  role="alert"
                >
                  {{ submitMessage.message }}
                </div>
              </div>

              <form
                [formGroup]="newPasswordForm"
                (ngSubmit)="onSubmit()"
                class="row g-3 needs-validation"
              >
                <div class="col-12">
                  <label for="password" class="form-label"
                    >Password Baru <span class="text-danger">*</span></label
                  >
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    required
                    formControlName="password"
                  />
                  <div
                    *ngIf="getErrorMessage('password', 'Password')"
                    class="text-danger"
                  >
                    {{ getErrorMessage('password', 'Password') }}
                  </div>
                </div>

                <div class="col-12">
                  <label for="confirmPassword" class="form-label"
                    >Konfirmasi Password Baru
                    <span class="text-danger">*</span></label
                  >
                  <input
                    type="password"
                    class="form-control"
                    id="confirmPassword"
                    required
                    formControlName="confirmPassword"
                  />
                  <div
                    *ngIf="
                      getErrorMessage('confirmPassword', 'Konfirmasi Password')
                    "
                    class="text-danger"
                  >
                    {{
                      getErrorMessage('confirmPassword', 'Konfirmasi Password')
                    }}
                  </div>
                </div>

                <div class="col-12 mt-3">
                  <button
                    *ngIf="!(isSubmitLoading$ | async)"
                    class="btn grad-button w-100"
                    type="submit"
                    [disabled]="newPasswordForm.invalid"
                  >
                    Kirim
                  </button>

                  <button
                    *ngIf="isSubmitLoading$ | async"
                    class="btn grad-button w-100"
                    disabled
                  >
                    <div
                      class="spinner-border"
                      style="width: 19px; height: 19px"
                      role="status"
                    >
                      <span class="visually-hidden">Loading...</span>
                    </div>
                  </button>

                  <button
                    class="btn grad-button-secondary w-100 mt-2"
                    (click)="navigateTo('/login')"
                  >
                    Kembali ke Login
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
